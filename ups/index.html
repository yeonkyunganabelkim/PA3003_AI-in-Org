  chapters:[
    {id:'morning',title:'1. The Package That Started the Conversation',kicker:'MONDAY · 7:42 A.M.',paragraphs:[
      'A customer in a Newark-area apartment building opens the tracking page for a package containing replacement equipment for a small catering business. The screen shows “Delivered” with a timestamp from the previous evening. A customer service note says the parcel was left in a secure location. The customer has checked the lobby, the package room, and the building’s front desk. Nobody has seen it.',
      'At 7:42 a.m., a new inquiry is filed. At 8:06 a.m., the service desk agent finds a completed delivery scan but no description of which doorway was used. A building employee tells the customer that packages are sometimes placed behind a side entrance when the main lobby is crowded. That side entrance is being repainted this week. The customer says it has never been an approved drop-off location.',
      'By 9:10 a.m., the customer has called twice. The package is eventually located that afternoon at a neighboring business and recovered. The service desk closes the inquiry. The original tracking event remains marked Delivered. In the performance report, the original service commitment was met.',
      'The incident looks minor compared with the tens of thousands of deliveries the center handles each day. Then Laura Bennett from Customer Solutions points out that her team has been hearing similar stories more frequently — not identical stories, but enough to make her concerned.'
    ]},
    {id:'center',title:'2. An Ordinary Week at Raritan Gateway',kicker:'THE CENTER · OPERATING CONTEXT',paragraphs:[
      'The Raritan Gateway Package Center serves a mixture of dense apartment corridors, office parks, quiet suburban streets and industrial receiving docks in central New Jersey. The first employee cars begin arriving before dawn. On the east side of the building, delivery vehicles line up in assigned positions while equipment operators and package handlers prepare for the morning sort.',
      'A small coffee cart parks along the access road on Fridays. It has become a favorite stop for early-shift employees, though supervisors occasionally complain that drivers linger too long when the line is slow. Near the main entrance, a laminated sign reminds visitors not to block the employee shuttle zone. The sign has been moved twice since nearby roadwork began.',
      'A new residential complex opened in one delivery zone over the summer. Several storefront businesses in another zone now use shared receiving spaces. Most delivery stops are routine. But employees sometimes disagree on what counts as a successful handoff: a parcel on a porch, with a concierge, in a locker, or inside a receiving room may all create different levels of certainty for the recipient.',
      'The center manages 146 regular weekday delivery routes and roughly 410 employees across shifts. Its average daily recorded delivery attempts are approximately 58,000. During the autumn reporting period, managers are also balancing leave requests, peak-season training, occasional handheld-device glitches, vehicle scheduling and questions about who owns a customer inquiry after the driver’s shift ends.'
    ]},
    {id:'goodnews',title:'3. The Numbers Look Better',kicker:'REGIONAL REVIEW · OCTOBER',paragraphs:[
      'For four consecutive reporting weeks, the on-time service rate has improved. Event-scan completion has also risen. The center manager has reason to be pleased: field teams were asked to reduce incomplete scan records, and the data suggest that task was taken seriously.',
      'At the same time, customer inquiries filed after a “Delivered” status have risen. More customers are contacting the service desk again after their original inquiries were closed. The second-attempt share has climbed as well, though not every second attempt is associated with a missing parcel.',
      'Some employees interpret the trends as evidence that the reporting system is becoming more accurate and therefore capturing problems that were once invisible. Others believe drivers are facing more complex delivery conditions. The customer solutions team says too many cases are closed before anyone knows where the item actually went.',
      'There is also an unusual accounting detail: the service performance report counts eligible deliveries; the customer inquiry system counts tickets; the dispatch summary counts delivery attempts. The three systems are not counting the same thing. A single shipment may appear in more than one report, and a single delivery stop can involve several packages.'
    ]},
    {id:'shift',title:'4. What the Afternoon Shift Remembers',kicker:'PEOPLE · WORK DESIGN',paragraphs:[
      'One driver remembers spending six minutes trying to find the correct entrance at a newly built apartment block. A different driver says the same complex has clearly marked parcel lockers and is easy to service. Neither experience appears in the regional KPI spreadsheet.',
      'A scanner charging rack was temporarily relocated after a minor maintenance inspection. A few employees reported that the new location created an extra walk at the end of a shift; the facilities group says the relocation lasted only three days. There was also a brief outage in the driver break-room vending machine. Most people agree the vending machine is unrelated to package delivery, but the complaint became a popular topic during shift changes.',
      'An experienced driver has asked whether route notes could be updated more quickly when a building changes its delivery entrance. Another employee believes the instructions are already available and that staff simply need better reminders. The union steward is concerned that any new monitoring system could be used to discipline drivers without considering operational context.',
      'Last month a supervisor circulated a reminder encouraging complete scan records. The reminder was well intentioned, but employees interpreted it differently. Some took it as guidance to scan more consistently; others felt that finishing administrative tasks had become more important than explaining unusual deliveries.'
    ]},
    {id:'customer',title:'5. Complaints That Do Not All Mean the Same Thing',kicker:'RECIPIENT EXPERIENCE',paragraphs:[
      'The service desk receives inquiries from apartment residents, storefront managers, people with mobility limitations, home-based business owners, and occasional recipients who have never used online tracking before. Some parcels were misplaced after delivery. Others were found with a neighbor or in an alternate location. A few were not yet delivered when the first inquiry was filed because information had been delayed or misunderstood.',
      'Customers sometimes ask why they received an automated notification but cannot find their package. They may not know that “delivered” is a record of a delivery event, not a guarantee that the intended person has physically taken possession of the parcel. In some cases the person at the destination does not have access to the lobby or loading area where the parcel was left.',
      'One business praises the professionalism of the drivers but criticizes the lack of a clear contact person after an issue occurs. Another resident says the system is convenient and almost all deliveries arrive without trouble. A third customer is frustrated not about the original delivery but because two customer-service agents gave different explanations.',
      'The service team has asked whether it should introduce a new follow-up process for uncertain deliveries. The dispatch group questions whether that would require more staff time. The technology group suggests checking the evidence first.'
    ]},
    {id:'decision',title:'6. The Review Before Peak Season',kicker:'LEADERSHIP · NEXT DECISION',paragraphs:[
      'Regional operations has asked the center to identify the organizational issue most worth addressing before the late-November and December delivery surge. The request is deliberately broad. The regional director does not want a technology purchase justified only by an alarming chart, and the center manager does not want to introduce a new procedure that slows down every successful delivery.',
      'There is an initial improvement budget, but the center has limits on additional staffing and cannot interrupt everyday operations. Any use of AI would have to respect the sensitivity of recipient data, clarify what the system is allowed to recommend, and identify when a human must verify an outcome.',
      'The management team has not agreed on whether the main challenge involves scan-data meaning, route complexity, physical handoffs, case-management procedures, staffing, or some combination. The available documents show competing signals but do not settle the question.',
      'Your team enters at this point. You have the initial performance view, selected customer feedback, several documented operational events and different perspectives from the people managing the center. More detailed records have been requested for the next review.'
    ]}
  ],

function story(){const ch=D.chapters[chapter];return wrap(`${pt('The situation inside Raritan Gateway','A detailed account of the people, routines, contradictory facts and ordinary details around the center.','PART I · CASE NARRATIVE')}<div class="story-section"><nav class="panel story-index" aria-label="Narrative chapters">${D.chapters.map((c,i)=>`<a href="#story" data-chapter="${i}" class="${chapter===i?'active':''}" ${chapter===i?'aria-current="true"':''}>${esc(c.title)}</a>`).join('')}</nav><article class="panel story-article"><span class="eyebrow">${esc(ch.kicker)}</span><h2 class="chapter-title">${esc(ch.title)}</h2>${ch.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="story-pagination">${chapter>0?`<button class="outline-btn" data-chapter="${chapter-1}">← Previous chapter</button>`:'<span></span>'}${chapter<D.chapters.length-1?`<button class="gold-btn" data-chapter="${chapter+1}">Next chapter →</button>`:`<a class="gold-btn" href="#people">Meet the people →</a>`}</div></article></div>`)}
function people(){return wrap(`${pt('People & Perspectives','Five people see different parts of the same operations system. Click each profile to read their background, evidence and concerns.','PART II · STAFF DIRECTORY')}<div class="grid-people">${D.people.map(p=>`<button class="person-card" data-person="${p.id}"><img src="${esc(p.img)}" alt="Portrait of ${esc(p.name)}" loading="lazy"><div class="p-meta"><span class="p-tag">${esc(p.tag).toUpperCase()}</span><strong>${esc(p.name)}</strong><small>${esc(p.role)}</small></div><div class="p-link">VIEW FULL PROFILE ↗</div></button>`).join('')}</div><div class="quote-panel"><strong style="display:block;color:#886023;font-size:10px;letter-spacing:.12em;margin-bottom:7px">INTERPRETING EMPLOYEE PERSPECTIVES</strong>These people have relevant experience, but they do not necessarily have the same evidence. An observation can be important without proving a root cause.</div>`)}
function incidents(){const c=D.incidents.find(x=>x.id===inc)||D.incidents[0];return wrap(`${pt('Shipment Investigation Board','Follow a delivery event from the system record to the recipient’s experience. Each file contains only selected initial evidence.','PART III · CASE RECORDS')}<div class="statsline"><span>6 SELECTED CASES</span><span>5 DELIVERY ZONES</span><span>EVENT TIME ≠ REPORT TIME</span></div><div class="caseboard"><section class="panel case-list" aria-label="Shipment cases">${D.incidents.map(x=>`<button class="case-row ${x.id===c.id?'active':''}" data-incident="${x.id}" aria-pressed="${x.id===c.id}"><span><b>${esc(x.id)}</b><time>${esc(x.date)}</time></span><strong>${esc(x.title)}</strong><em>${esc(x.zone)} · ${esc(x.status)}</em></button>`).join('')}</section><article class="panel incident-detail"><span class="eyebrow">RECORD ${esc(c.id)} · ${esc(c.zone)}</span><h2>${esc(c.title)}</h2><p class="muted-line">${esc(c.context)} · ${esc(c.status)}</p><div class="tagrow">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><ol class="timeline">${c.events.map(([d,e])=>`<li><b>${esc(d)}</b><span>${esc(e)}</span></li>`).join('')}</ol><div class="brief-note"><strong>Investigator's question</strong><p>${esc(c.question)}</p></div><div class="note">These events were selected for review; the log is not the complete record of every action or all packages in the facility.</div></article></div>`)}
function evidencePage(){const tabs=[['feedback','Customer feedback'],['observations','Field observations'],['documents','Available documents']];let content='';if(evidence==='feedback'){const list=D.feedback.filter(x=>[x.id,x.date,x.type,x.zone,x.text].join(' ').toLowerCase().includes(term.toLowerCase()));content=`<div class="panelpad"><div class="filterbar"><input type="search" id="e-search" placeholder="Search feedback by zone, concern, ID..." value="${esc(term)}" aria-label="Search feedback"><span id="e-count" class="panel-hint">${list.length} of ${D.feedback.length} comments</span></div><div id="e-results" class="feedback-grid">${feedbackCards(list)}</div></div>`}else if(evidence==='observations'){content=`<div class="tablewrap"><table class="datatable"><thead><tr><th>Date</th><th>Field note</th><th>Operational context</th></tr></thead><tbody>${D.observations.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}else{const docs=[['01','Initial Narrative','6-chapter management situation report','story'],['02','Staff Perspectives','Five key personnel and different interpretations','people'],['03','Delivery Event Files','Six selected shipment incident timelines','incidents'],['04','KPI Review','Four weekly periods with indicator definitions','metrics'],['05','Zone Comparison','Five operating areas with normalised inquiry rates','zones'],['06','Management Constraints','Preliminary budget, staffing and policy boundaries','constraints']];content=`${docs.map(([n,title,desc,to])=>`<div class="doc-tab"><span class="doc-icon">▤</span><div style="flex:1"><strong>DOC ${n} · ${esc(title)}</strong><small>${esc(desc)}</small></div>${link(to,'Open')}</div>`).join('')}`}
return wrap(`${pt('Internal Evidence Library','Browse selected customer reports, informal field notes and the first management documents.','PART IV · EVIDENCE DOSSIER')}<nav class="segment-tabs" aria-label="Evidence categories">${tabs.map(([id,label])=>`<button data-evidence="${id}" class="${id===evidence?'active':''}" aria-pressed="${id===evidence}">${label}</button>`).join('')}</nav><section class="panel">${content}</section><div class="note"><strong>Evidence caution:</strong> Selected customer comments are not a representative survey. Operational notes may omit events or describe different parts of the same incident. The record-level dataset is not part of this initial release.</div>`)}
function feedbackCards(list){return list.map(c=>`<article class="comment"><header><span>${esc(c.id)} · ${esc(c.zone)}</span><span>${esc(c.date)}</span></header><strong>${esc(c.type)}</strong><p>“${esc(c.text)}”</p></article>`).join('')||'<div class="empty">No comments match the search.</div>'}
function chartSVG(m){const arr=m.vals,min=Math.min(...arr),max=Math.max(...arr),pad=Math.max((max-min)*.35, max*.025,1),lo=min-pad,hi=max+pad,W=720,H=260,left=78,right=25,top=25,bottom=40,ww=W-left-right,hh=H-top-bottom;const xy=(v,i)=>[left+i*ww/(arr.length-1),top+(hi-v)/(hi-lo)*hh];const line=arr.map((v,i)=>xy(v,i).join(',')).join(' ');const textval=v=>m.unit==='attempts'?num(v):m.unit==='cases'?v.toFixed(0):v.toFixed(1)+(m.unit==='%'?'%':'');const grid=[0,.25,.5,.75,1].map(t=>{const v=hi-t*(hi-lo),y=top+t*hh;return `<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#e8e1d8" stroke-dasharray="4 5"/><text x="${left-12}" y="${y+3}" text-anchor="end" font-size="10" fill="#85776a">${textval(v)}</text>`}).join('');return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.name)} trend from ${textval(arr[0])} to ${textval(arr.at(-1))}">${grid}<polyline fill="none" stroke="#be8730" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${line}"/>${arr.map((v,i)=>{let [x,y]=xy(v,i);return `<circle cx="${x}" cy="${y}" r="6" fill="#ae7424" stroke="white" stroke-width="3"/><text x="${x}" y="${y-17}" text-anchor="middle" font-size="12" fill="#4a321e" font-weight="bold">${textval(v)}</text><text x="${x}" y="${H-11}" text-anchor="middle" fill="#73675b" font-size="11">${D.weeks[i]}</text>`}).join('')}</svg>`}
function downloadCSV(){const lines=[['week_ending',...D.metrics.map(x=>x.id)].join(','),...D.weeks.map((w,i)=>[w,...D.metrics.map(x=>x.vals[i])].join(','))];const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ups_week10_performance_summary.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function metrics(){const m=D.metrics.find(x=>x.id===metric)||D.metrics[0],prev=m.vals[0],last=m.vals.at(-1);return wrap(`${pt('Performance & Measurement','Explore how a center can improve one kind of performance while experience worsens elsewhere. Definitions matter.','PART V · KPI REVIEW')}<div class="metric-selector">${D.metrics.map(x=>`<button class="metric-select ${x.id===metric?'active':''}" data-metric="${x.id}"><span>${esc(x.name)}</span><strong>${x.unit==='attempts'?num(x.vals.at(-1)):x.unit==='cases'?x.vals.at(-1):x.vals.at(-1).toFixed(1)+'%'}</strong><small>Week ending Oct 25</small></button>`).join('')}</div><section class="panel chart-wrap"><div class="chart-head"><h3>${esc(m.name)}</h3><span class="chart-legend">Four consecutive reporting weeks · selected metric</span></div>${chartSVG(m)}<div class="metric-desc"><b>What is being measured?</b><p style="margin:6px 0 0">${esc(m.description)}</p></div></section><div class="toolbar"><span style="font-size:11px;color:#7f7266">Period summary only; not the Week 11 shipment-level dataset.</span><button class="outline-btn" id="csv-download">↓ Download Week 10 KPI summary (.csv)</button></div><div class="page-columns">${panel('TWO PERFORMANCE STORIES',`<div class="panelpad"><p style="font-size:12.5px"><strong>On-time service:</strong> 95.8% → 96.6%. <strong>Completed delivery scans:</strong> 98.1% → 99.0%.</p><p style="font-size:12.5px"><strong>Delivered-not-received inquiries:</strong> 46 → 108. <strong>Reopened tickets:</strong> 14.4% → 26.1%.</p><p style="font-size:12.5px">These systems count different things. The figures are evidence of a pattern, not proof of one root cause.</p></div>`)}${panel('MEASUREMENT CHECK',`<div class="panelpad"><p style="font-size:12.5px">A shipment can meet its service commitment while still generating a question about where it was left. A customer inquiry can also arise even when a parcel was delivered correctly.</p><p style="font-size:12.5px;margin-bottom:0">Ask whether a metric measures the work done, the service received, or a record entered into a system.</p></div>`)}</div>`)}
function zones(){const z=D.zones.find(x=>x.id===zone)||D.zones[0],maxRate=Math.max(...D.zones.map(rate));return wrap(`${pt('Delivery Zone Comparison','The absolute number of inquiries can mislead when delivery volume and the nature of stops differ.','PART VI · ROUTE CONTEXT')}<div class="zone-grid"><section class="panel"><header class="panel-title"><strong>RECORDED DELIVERIES & INQUIRIES · OCT 25 WEEK</strong></header><div class="zone-list">${D.zones.map(x=>`<button data-zone="${x.id}" class="zone-button ${z.id===x.id?'active':''}"><div class="zone-title"><span>${esc(x.id)} · ${esc(x.name)}</span><span>${x.claims} inquiries</span></div><small>${num(x.attempts)} attempts · ${rate(x).toFixed(2)} inquiries per 10,000 attempts</small><div class="zone-bar"><b style="width:${rate(x)/maxRate*100}%"></b></div></button>`).join('')}</div></section><section class="panel zone-detail"><span class="eyebrow">DELIVERY AREA ${esc(z.id)}</span><h3>${esc(z.name)}</h3><span class="tag">${esc(z.type)}</span><div class="zone-facts"><div><small>Recorded attempts</small><strong>${num(z.attempts)}</strong></div><div><small>Delivered-not-received inquiries</small><strong>${z.claims}</strong></div></div><p><strong>Area conditions:</strong> ${esc(z.context)}.</p><p><strong>Selected field observation:</strong> ${esc(z.notes)}</p><div class="brief-note"><strong>Rate comparison</strong><p>${rate(z).toFixed(2)} inquiries per 10,000 recorded delivery attempts. A higher rate does not establish which employee, system or process caused a problem.</p></div></section></div><div class="note"><strong>Scope note:</strong> These zone summaries total ${num(D.zones.reduce((s,z)=>s+z.attempts,0))} recorded delivery attempts and ${D.zones.reduce((s,z)=>s+z.claims,0)} delivered-not-received inquiries for the week ending Oct 25. Zone totals are consistent with the center-wide summary but do not reveal individual customer identities, stops or drivers.</div>`)}
function constraints(){return wrap(`${pt('Constraints & Resources','Any recommendation must respect the center’s staffing, service, security and decision-authority limits.','PART VII · MANAGEMENT PARAMETERS')}<div class="constraint-banner"><div><small>MAXIMUM ADDITIONAL PILOT FUNDING</small><h2>$120,000</h2><p>A ceiling, not a required expenditure</p></div><aside><small>INITIAL PILOT WINDOW</small><strong>10 weeks</strong><small>ADDITIONAL TEMPORARY ROLES</small><strong>Maximum 2</strong></aside></div>${panel('PRELIMINARY DECISION BOUNDARIES',`<div class="tablewrap"><table class="datatable"><thead><tr><th>Area</th><th>Management condition</th></tr></thead><tbody>${D.constraints.map(([a,b])=>`<tr><td><b>${esc(a)}</b></td><td>${esc(b)}</td></tr>`).join('')}</tbody></table></div>`)}<div class="brief-note" style="margin-top:17px"><strong>Managerial discretion</strong><p>Leadership has not authorized a particular software purchase. An effective operational change may involve better information handoffs, revised processes, employee guidance, or AI-supported analysis — provided the expected benefit and tradeoffs are credible.</p></div>`)}
function profileOpen(id){const p=D.people.find(x=>x.id===id);if(!p)return;modal.innerHTML=`<div class="modalback" data-close="yes"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(p.name)} staff profile"><button class="close" data-close="yes" aria-label="Close profile">×</button><header class="modal-head"><img src="${esc(p.img)}" alt="Generated portrait of ${esc(p.name)}"><div><span class="eyebrow">PERSONNEL FILE · ${esc(p.tag)}</span><h2>${esc(p.name)}</h2><p>${esc(p.role)}</p></div></header><div class="modalbody"><div class="split-note"><div><small>EXPERIENCE</small><p>${esc(p.tenure)}</p></div><div><small>MANAGEMENT FOCUS</small><p>${esc(p.focus)}</p></div></div><blockquote>${esc(p.quote)}</blockquote><h3>Perspective from the operations review</h3><p>${esc(p.detail)}</p><h3>A limitation in this perspective</h3><p>${esc(p.blind)}</p><div class="brief-note"><strong>Question to consider</strong><p>${esc(p.question)}</p></div><p class="directory-note">Staff characters and portraits were created for this educational simulation.</p></div></section></div>`;document.body.style.overflow='hidden';modal.querySelector('.close').focus()}
function closeModal(){modal.innerHTML='';document.body.style.overflow=''}
const views={overview,story,people,incidents,evidence:evidencePage,metrics,zones,constraints};
function render(){const r=location.hash.replace('#','')||'overview',id=views[r]?r:'overview';sideRender(id);main.innerHTML=views[id]();document.title=`${routes.find(x=>x[0]===id)?.[1]||'Overview'} | Raritan Gateway Operations Review`;side.classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');window.scrollTo(0,0)}
// Keep the current case page active when Skip to content is selected.
document.addEventListener('click', event => {
 const skipLink = event.target.closest('a[href="#main"]');
 if (!skipLink) return;
 event.preventDefault();
 const target = document.getElementById('main');
 if (target) {
   target.focus({preventScroll:true});
   target.scrollIntoView({block:'start'});
 }
});
addEventListener('hashchange',render);document.addEventListener('click',e=>{const c=e.target.closest('[data-chapter]');if(c){e.preventDefault();chapter=+c.dataset.chapter;render();return}const p=e.target.closest('[data-person]');if(p){profileOpen(p.dataset.person);return}const cl=e.target.closest('[data-close]');if(cl){closeModal();return}const a=e.target.closest('[data-incident]');if(a){inc=a.dataset.incident;render();return}const t=e.target.closest('[data-evidence]');if(t){evidence=t.dataset.evidence;term='';render();return}const z=e.target.closest('[data-zone]');if(z){zone=z.dataset.zone;render();return}const m=e.target.closest('[data-metric]');if(m){metric=m.dataset.metric;render();return}if(e.target.closest('#csv-download')){downloadCSV();return}if(e.target.closest('#menuBtn')){const open=side.classList.toggle('open');e.target.closest('#menuBtn').setAttribute('aria-expanded',String(open));return}});document.addEventListener('input',e=>{if(e.target.id==='e-search'){term=e.target.value;const a=D.feedback.filter(x=>[x.id,x.date,x.type,x.zone,x.text].join(' ').toLowerCase().includes(term.toLowerCase()));document.getElementById('e-results').innerHTML=feedbackCards(a);document.getElementById('e-count').textContent=`${a.length} of ${D.feedback.length} comments`;}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
})();
</script>
