  eyebrow:'CASE FILE 01 · RETAIL OPERATIONS',
  subtitle:'A successful warehouse. Conflicting reports. An important management decision.',
  disclaimer:'Fictional educational case using a real-world organization as background. Harbor Point, all named employees, events, figures, and reports are invented. This is not an official Costco website.',

  ],
  chapters:[
    {id:'morning',title:'A Tuesday Morning at Harbor Point',label:'01',paragraphs:[
      'At 8:15 a.m. on Tuesday, November 3, the Harbor Point warehouse is already busy. Members will not arrive for another hour and forty-five minutes, but employees are moving pallets, checking merchandise displays, and preparing the sales floor.',
      'A forklift moves slowly through the center aisle while two employees debate where to place a shipment of bottled beverages. Near the entrance, Halloween decorations have given way to holiday gift baskets, artificial Christmas trees, and imported chocolates. A display of winter jackets has been moved twice in three weeks.',
      'Someone has left a handwritten note beside a stack of unopened merchandise: “Please confirm location before moving again.” Nobody remembers who wrote it.',
      'In the bakery, employees are preparing for another busy week. Last Saturday, the bakery sold more pumpkin pies than expected, and a supervisor mentioned that several members had asked whether the same pies would be available for Thanksgiving.',
      'At membership services, several employees are answering questions about a popular household cleaning product. One employee remembers seeing a pallet near receiving. Another says the item might have gone to another location. The system shows merchandise associated with the item, but nobody can confirm the quantity available on the sales floor.',
      'A customer has not yet arrived to complain about it today. But by 10:30 a.m., someone probably will.'
    ],quote:'“Knowing something and being able to do something about it are two different things.”'},
    {id:'warehouse',title:'The Harbor Point Warehouse',label:'02',paragraphs:[
      'Harbor Point opened in 2015 in a densely populated part of northern New Jersey. It serves suburban households, commuters, local restaurant owners, childcare businesses, and neighborhood small businesses.',
      'Weekday mornings often attract retirees and shoppers with flexible schedules. Friday afternoons and weekends are considerably busier. Several new apartment buildings have recently opened nearby, while a shopping center has lost a competing retail tenant. Whether these developments have materially changed purchasing patterns remains uncertain.',
      'Products are frequently displayed on pallets, and inventory may be stored on upper racks. Seasonal merchandise changes the layout. Members may not find dozens of brands of the same product, but they expect competitive prices and reasonably reliable access to the merchandise the warehouse carries.'
    ]},
    {id:'success',title:'A Warehouse With Several Success Stories',label:'03',paragraphs:[
      'Harbor Point is not a failing operation. Sales and transactions increased across three consecutive reporting periods. Incoming deliveries are arriving on schedule more consistently. The regional office recently recognized the warehouse for sustaining sales despite growing competition.',
      'A summer checkout-line coordination practice appears to have reduced confusion during busy periods, although it has not been formally evaluated. The bakery and fresh foods departments report strong seasonal demand. Several supervisors received compliments about employees’ helpfulness.',
      'The regional office is even considering Harbor Point as a success story for an upcoming management meeting. Yet some employees and customers see a different picture.'
    ]},
    {id:'saturday',title:'The Saturday That Raised Questions',label:'04',paragraphs:[
      'On Saturday, October 24, at approximately 10:20 a.m., a member asked for a large package of dishwasher detergent. An employee checked its usual aisle and then asked a coworker who had worked the previous evening. After several minutes they concluded the item was probably unavailable. The member left without it.',
      'Later, a supervisor noticed that a shipment containing several household products had arrived earlier that week. But receiving a product and making it available for sale are not always the same event.',
      'At 1:00 p.m., another member questioned why seasonal displays occupied so much floor space when everyday items were missing. At 2:15 p.m., a supervisor requested extra replenishment support, but the front-end manager could not release an employee because the checkout lines were unusually busy.',
      'At 3:40 p.m., a forklift operator reported that a scheduled pallet was in a different storage location than expected. It was eventually found, but the incident never appeared in the customer complaint system.',
      'The bakery sold out of popular items, a sampling event attracted crowds, and checkout staff received praise. Total daily sales were strong. A longtime member nevertheless filed a complaint about an item missing on three consecutive visits. The daily sales summary was positive; the membership services report was not.'
    ]},
    {id:'small',title:'Small Details That May—or May Not—Matter',label:'05',paragraphs:[
      'A winter-jacket display was moved twice. Some new employees are still learning the warehouse layout. A temporary break-room scheduling change caused complaints but was reversed. Staff occasionally use handwritten notes to communicate product locations.',

function people(){
 return `<section class="page-title"><span class="section-kicker">PART II · PEOPLE & PERSPECTIVES</span><h2>Five people. Five versions of the problem.</h2><p>Tap a profile to read that manager’s responsibilities, perspective, recent statement and a question worth investigating.</p></section>
 <div class="people-grid">${costco.people.map(p=>`<button class="person-card" data-person="${esc(p.id)}" aria-label="Read profile for ${esc(p.name)}"><div class="person-top"><img src="${esc(p.image)}" alt="Generated portrait of ${esc(p.name)}" width="96" height="96"><div><h3>${esc(p.name)}</h3><p class="person-role">${esc(p.role)}</p><span class="tenure">${esc(p.tenure)}</span></div></div><p class="person-summary">${esc(p.view)}</p><span class="person-action">Open profile <span aria-hidden="true">→</span></span></button>`).join('')}</div>
 <div class="notice"><strong>Management perspectives</strong><p>Compare the responsibilities and observations of the different team members. No one profile provides a complete account of the warehouse.</p></div>`;
}
function kpiChart(k){
 const vals=k.values,min=Math.min(...vals),max=Math.max(...vals);
 const bottom=min===max?min-1:min-(max-min)*.20;
 const top=min===max?max+1:max+(max-min)*.20;
 const y=v=>Math.round(228-(v-bottom)/(top-bottom)*169);
 const xs=[94,280,466];
 const pts=vals.map((v,i)=>`${xs[i]},${y(v)}`).join(' ');
 return `<svg class="metric-chart" viewBox="0 0 550 290" role="img" aria-label="${esc(k.label)}: ${k.display.join(', ')} for three periods"><title>${esc(k.label)} across three periods</title>${[74,125,176,227].map(yy=>`<line x1="66" y1="${yy}" x2="515" y2="${yy}" stroke="#e4e9ef" stroke-width="1"/>`).join('')}<polyline points="${pts}" fill="none" stroke="#ba233c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${xs[i]}" cy="${y(v)}" r="6" fill="#ba233c" stroke="white" stroke-width="3"/><text x="${xs[i]}" y="${y(v)-17}" text-anchor="middle" class="svg-value">${esc(k.display[i])}</text><text x="${xs[i]}" y="257" text-anchor="middle" class="svg-label">P${i+1}</text>`).join('')}</svg>`;
}
function metrics(){
 const k=costco.kpis.find(x=>x.key===activeMetric)||costco.kpis[0];
 return `<section class="page-title"><span class="section-kicker">EXHIBIT A · INTERNAL PERFORMANCE</span><h2>What do the metrics actually show?</h2><p>Choose an indicator to inspect its trend. These period-level summaries cannot, by themselves, prove an underlying cause.</p></section>
 <div class="metric-layout"><section class="panel chart-panel"><label for="metric-pick" class="form-label">Select a performance indicator</label><select id="metric-pick">${costco.kpis.map(t=>`<option value="${esc(t.key)}" ${t.key===k.key?'selected':''}>${esc(t.label)}</option>`).join('')}</select><div class="metric-heading"><h3>${esc(k.label)}</h3><span>${esc(k.unit)}</span></div>${kpiChart(k)}<p class="metric-note">${esc(k.note)}</p></section><aside class="panel"><span class="section-kicker">IMPORTANT CONTEXT</span><h3>Before you interpret</h3><p>These are aggregate case reports. Increasing sales may coexist with service or staffing challenges.</p><p>Different metrics count different units. For example, member transactions are not unique members, and incoming delivery punctuality is not the same as shelf availability.</p><a class="text-link" href="#/costco/evidence">Compare with qualitative evidence →</a></aside></div>
 <section class="panel big-table"><h3>Full performance dashboard</h3><div class="table-scroll"><table><thead><tr><th scope="col">Indicator</th>${costco.periods.map(s=>`<th scope="col">${esc(s)}</th>`).join('')}</tr></thead><tbody>${costco.kpis.map(m=>`<tr><th scope="row">${esc(m.label)}</th>${m.display.map(s=>`<td>${esc(s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="data-foot">Source: initial internal performance summary · Consecutive four-week periods.</p></section>`;
}
function evidence(){
 const nav=[['feedback','Member Feedback'],['observations','Operational Notes'],['dashboard','KPI Snapshot']];
 let body='';
 if(activeEvidence==='feedback'){
 const matches=costco.feedback.filter(f=>[f.id,f.category,f.quote].join(' ').toLowerCase().includes(feedbackQuery.toLowerCase()));
 body=`<div class="filterline"><label for="feedback-search">Search comments</label><input id="feedback-search" placeholder="Try: item, employee, checkout..." value="${esc(feedbackQuery)}" type="search"><span class="result-count">${matches.length} of ${costco.feedback.length} records</span></div><div class="feedback-grid">${matches.map(f=>`<article class="feedback-card"><div><span class="doc-id">MEMBER ${esc(f.id)}</span><span class="doc-date">${esc(f.date)}</span></div><strong>${esc(f.category)}</strong><p>“${esc(f.quote)}”</p></article>`).join('')||'<p>No records match that search.</p>'}</div><p class="data-foot">Selected comments are not a representative sample of all members. They are selected, nonrepresentative case records.</p>`;
 } else if(activeEvidence==='observations'){
 body=`<div class="table-scroll"><table><thead><tr><th>Date</th><th>Observation</th><th>Context</th></tr></thead><tbody>${costco.observations.map(o=>`<tr>${o.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="data-foot">These informal observations were not collected for a formal investigation and may omit important events.</p>`;
 } else {body=`<p>This summary offers a starting point. The dedicated dashboard lets you inspect all nine indicators, their definitions, and potential measurement limitations.</p><a class="button-dark" href="#/costco/metrics">Open the full dashboard →</a>`}
 return `<section class="page-title"><span class="section-kicker">PART III · INTERNAL EVIDENCE</span><h2>Explore the evidence dossier</h2><p>Different sources reflect different experiences. Browse the available records and consider what is missing.</p></section><div class="evidence-tabs">${nav.map(([k,l])=>`<button data-evidence="${k}" class="${activeEvidence===k?'active':''}" aria-pressed="${activeEvidence===k}">${l}</button>`).join('')}</div><div class="panel evidence-panel">${body}</div><div class="notice"><strong>Data access note</strong><p>The additional row-level dataset is intentionally not included in the public student portal yet. Only initial case evidence is displayed here.</p></div>`;
}
function constraints(){return `<section class="page-title"><span class="section-kicker">PART IV · MANAGEMENT CONSTRAINTS</span><h2>A limited budget. A busy warehouse.</h2><p>Any proposed change must work within operational, staffing and financial boundaries.</p></section><div class="limit-banner"><div><small>POTENTIAL MAXIMUM PILOT FUNDING</small><strong>$85,000</strong><span>Maximum, not a spending target</span></div><div class="limit-side"><small>PILOT WINDOW</small><strong>12 weeks</strong><small>ADDITIONAL TEMPORARY STAFF</small><strong>Up to 2</strong></div></div><div class="panel big-table"><h3>Preliminary conditions</h3><div class="table-scroll"><table><thead><tr><th>Area</th><th>Requirement or limitation</th></tr></thead><tbody>${costco.constraints.map(([a,b])=>`<tr><th scope="row">${esc(a)}</th><td>${esc(b)}</td></tr>`).join('')}</tbody></table></div></div><div class="notice"><strong>A prior technology initiative</strong><p>Several employees refer to a previously discontinued initiative, but recollections differ. The archived review is not included in the current release.</p></div>`}
function decision(){return `<section class="page-title"><span class="section-kicker">PART V · THE DECISION AHEAD</span><h2>The regional director wants a defensible judgment.</h2><p>Harbor Point is not being ordered to install AI. Leadership is asking what problem deserves attention and whether a change is justified.</p></section><div class="decision-hero"><span>REGIONAL DIRECTOR · INTERNAL BRIEFING</span><blockquote>“I don’t expect anyone to solve every problem in this building. I do expect us to understand which problems deserve our attention, what evidence supports that judgment, and what changes we can realistically make.”</blockquote></div><div class="split-two"><section class="panel"><span class="section-kicker">THE CENTRAL TENSION</span><h3>Not one metric. Not one voice.</h3><p>The sales summary and member service records offer different pictures. Warehouse employees disagree about causes and responsibilities.</p><p>Management will need to consider financial outcomes, work design, employees, customer experience, risk and implementation feasibility.</p></section></div><p class="small-note">Activity sheet responses and reflection assignments are submitted through the course LMS, not through this site.</p>`}
function render(){
 const r=route(); const c=dirs.find(x=>x.id===r.id);
 if(!c && r.id!=='home'){location.hash='#/';return}
 sidebarRender(r);
 let content='';
 if(r.id==='home')content=homeRender();
 else if(c.status==='draft')content=draftRender(c);
 else {
  const f={overview,story,people,evidence,metrics,constraints,decision}[r.section]||overview;
  content=caseWrapper(r,f());
 }
 main.innerHTML=content;
 document.title=(r.id==='home'?'Organization Directory':c.name+' · '+(r.section||'Case File'))+' | Organizational AI Case Lab';
 document.body.classList.remove('nav-open');
 window.scrollTo({top:0,behavior:'instant'});
}
function profileOpen(id){
 const p=costco.people.find(x=>x.id===id);if(!p)return;
 modal.innerHTML=`<div class="modal-backdrop" data-close="true"><section class="profile-modal" role="dialog" aria-modal="true" aria-label="${esc(p.name)} profile"><button class="close-modal" data-close="true" aria-label="Close profile">×</button><div class="modal-header"><img src="${esc(p.image)}" alt="Generated portrait of ${esc(p.name)}" width="126" height="126"><div><span class="section-kicker">INTERNAL STAFF PROFILE</span><h2>${esc(p.name)}</h2><p>${esc(p.role)}</p></div></div><div class="modal-details"><div><small>BACKGROUND</small><p>${esc(p.tenure)}</p></div><div><small>MANAGEMENT FOCUS</small><p>${esc(p.focus)}</p></div></div><blockquote>${esc(p.quote)}</blockquote><h3>What this person sees</h3><p>${esc(p.detail)}</p><div class="modal-question"><strong>QUESTION TO CONSIDER</strong><p>${esc(p.question)}</p></div><div class="modal-footer">Personnel directory · Operations review</div></section></div>`;
 document.body.classList.add('modal-open');modal.querySelector('.close-modal').focus();
}
function profileClose(){modal.innerHTML='';document.body.classList.remove('modal-open')}
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-person]');if(p){profileOpen(p.dataset.person);return}
 const q=e.target.closest('[data-close]');if(q){profileClose();return}
 const t=e.target.closest('[data-evidence]');if(t){activeEvidence=t.dataset.evidence;render();return}
});
document.addEventListener('change',e=>{if(e.target.id==='metric-pick'){activeMetric=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='feedback-search'){const start=e.target.selectionStart;feedbackQuery=e.target.value;const r=main.querySelector('.feedback-grid');const matches=costco.feedback.filter(f=>[f.id,f.category,f.quote].join(' ').toLowerCase().includes(feedbackQuery.toLowerCase()));r.innerHTML=matches.map(f=>`<article class="feedback-card"><div><span class="doc-id">MEMBER ${esc(f.id)}</span><span class="doc-date">${esc(f.date)}</span></div><strong>${esc(f.category)}</strong><p>“${esc(f.quote)}”</p></article>`).join('')||'<p>No records match that search.</p>';main.querySelector('.result-count').textContent=`${matches.length} of ${costco.feedback.length} records`;}}
);
document.addEventListener('keydown',e=>{if(e.key==='Escape')profileClose()});
// Prevent in-page anchors from being mistaken for a new hash route.
document.addEventListener('click', event => {
 const chapterLink = event.target.closest('.chapter-list a[href^="#chapter-"]');
 if (chapterLink) {
   event.preventDefault();
   const target = document.getElementById(chapterLink.getAttribute('href').slice(1));
   if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
   return;
 }
 const skipLink = event.target.closest('a[href="#main"]');
 if (skipLink) {
   event.preventDefault();
   main.focus({preventScroll:true});
   main.scrollIntoView({block:'start'});
 }
});
window.addEventListener('hashchange',render);
render();

</script>
