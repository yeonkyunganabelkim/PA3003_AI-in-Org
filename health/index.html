<script>window.RWJ_CASE = {"facility":[["Service setting","Harbor View Outpatient Center"],["Region","Northern New Jersey"],["Case review","November 2026"],["Service lines","Primary care · Cardiology · Orthopedics · Gastroenterology · Dermatology"],["Patient-access channels","Phone · Online · Referrals · In-person"],["Management horizon","90-day improvement pilot"]],"chapters":[{"label":"01 · Opening scene","title":"Tuesday, 7:42 a.m. — Before the First Patient","paragraphs":["The lights in the Harbor View Outpatient Center are bright long before most patients arrive. Outside, the parking lot is half full. Inside, someone has moved the basket of complimentary reading glasses from the reception desk to a small table beside the elevators. By 7:42 a.m., a registration clerk has already been asked where it went.","The center’s first appointment is at 8:00 a.m. A woman wearing a gray winter coat approaches the reception window and explains that she called twice last week to confirm her visit. The clerk finds a canceled appointment under her name and a second appointment associated with a slightly different visit type. The patient insists that neither cancellation nor change was communicated to her. A colleague helps find a same-day opening, but the interaction takes twelve minutes and attracts a line of waiting patients.","At the same time, across the building, an orthopedic physician’s first patient is running late. A different specialty team has two short openings that will likely go unused. A patient trying to schedule a routine follow-up has been told there are no appointments for several weeks. None of these facts necessarily contradict the others: an opening in one service, at one time, with one provider, may be useless to a different patient.","On the second floor, an employee printer repeatedly jams on a stack of appointment instruction sheets. Staff have learned to keep a backup pile nearby. Someone jokes that fixing the printer would probably improve everyone's mood more than another management dashboard. The joke is not entirely unrelated to the day’s work; staff routinely explain the same instructions several times by phone.","By 8:30 a.m., the patient access contact center has a queue of callers waiting for an agent. The reception area itself, however, looks calm. A visitor later describes the facility as 'organized and friendly.' A person waiting for a call back might describe it very differently."]},{"label":"02 · The organization","title":"A Network With More Than One Front Door","paragraphs":["Harbor View is a suburban multi-specialty outpatient site connected to a larger New Jersey health system. The building includes clinical offices, diagnostic service areas and a small shared waiting area. Its patient population ranges from commuters who prefer early appointments to older residents who call the scheduling desk rather than use an online portal. Some patients use language assistance; others rely on a family member to coordinate transportation and appointments.","Appointments enter through several channels: direct calls, patient-initiated online requests, internal referrals following visits, and external referral requests. Each pathway has a slightly different set of requirements. New patient visits can require longer slots and different paperwork than follow-up visits. Some appointment types require clinical review before staff may confirm a time. A vacant calendar block is therefore not always equivalent to an appointment that a patient can book.","The outpatient administration team reports growing demand. New physician practices have joined the referral network, several clinics have expanded early-morning hours, and a community health fair generated a surge of questions about preventive screenings. Harbor View also recently opened a small coffee kiosk. Some employees like having it; others complain that the queue briefly blocks the corridor near the elevators. There is no evidence that the kiosk affects scheduling.","Harbor View’s staff members routinely move between telephone calls, electronic messages, patient check-in and provider requests. The patient access team works across service lines; clinical staff manage appointment templates and changes with their own teams. The boundaries between these responsibilities are not always obvious to patients, and occasionally they are not obvious to employees either.","Leadership has heard both 'there are no appointments' and 'we are not using every available appointment.' It does not know whether those statements describe the same problem, two different problems, or two symptoms of something more complicated."]},{"label":"03 · Signals","title":"What the Reports Appear to Show","paragraphs":["Three months ago, Harbor View started a standing Friday access meeting. The meeting includes patient access staff, clinic operations, and a representative from medical leadership. Its purpose was practical: find out why so many people report difficulty getting appointments while clinical managers continue to see gaps in daily schedules.","The earliest report focused on the number of appointment requests and the number successfully scheduled. Later, the team began tracking patient callback attempts, schedule releases and the time to the next appointment shown to agents. Staff found that these measures are affected by how the request is classified and by whether appointment blocks are ready for general scheduling.","A chart circulated in October shows that the typical wait for the next offered appointment has increased. Yet the same packet identifies appointment blocks still marked open in some specialty schedules. One supervisor interpreted these open blocks as proof that scheduling employees were not using available capacity. Another supervisor noted that some blocks were too short, limited to certain visit types, or available only at times the requesting patient could not attend.","Patient survey comments are similarly mixed. Several respondents praise their clinicians, the check-in staff, and the cleanliness of the waiting room. Others describe leaving messages without receiving a clear response or being transferred between departments. The survey does not capture every caller, and patients who never schedule a visit may be especially difficult to reach for feedback.","The medical director asks a question the report cannot yet answer: 'Are we losing appointments, or are we losing the ability to connect the right patient to the right appointment?'"]},{"label":"04 · A small incident","title":"A Referral That Went Around in Circles","paragraphs":["On October 19, a patient referred for an outpatient consultation called to check on the status of a request. The scheduling agent could see the referral in the system but could not confirm the necessary visit type. The agent sent a message to the clinic. Later, a clinic employee saw the message and requested an additional detail from the referring office. The original patient did not receive a clear update during the exchange.","Three days later, the patient called again. A second agent attempted to schedule a standard consultation, found no eligible slots in the immediate scheduling window, and offered to call back. When a supervisor reviewed the case, she discovered that an appointment might have been possible at an affiliated location, but the patient had not been asked whether traveling there was practical.","Nothing in this record establishes that anyone acted carelessly. Each employee appears to have followed an instruction consistent with their role. The sequence nevertheless took several business days and required repeated patient contact.","Other patient requests moved smoothly that same week. One patient booked a routine follow-up online within minutes. An agent helped another patient find a cancellation slot on the same day. Those successes appear infrequently in the complaint records, although they matter to understanding the system.","By Friday, managers had three different explanations for the circular referral: not enough specialty capacity, incomplete referral information, and too many organizational handoffs. Which explanation matters most would depend on patterns beyond a single case."]},{"label":"05 · People under pressure","title":"The Employees Have Different Explanations","paragraphs":["The contact center supervisor says the team is frequently asked to explain clinical appointment rules that agents did not create. She believes an increase in transfers and callbacks is consuming time that could otherwise be used to help patients. The senior scheduling analyst is more cautious. Her view is that a category labeled 'available' in the reporting system may not be available for the patient currently on the telephone.","A physician leader points out that an unscheduled time block may exist because a clinician reserved it for urgent follow-up or because the visit requires a different appointment length. Filling every block could make access appear more efficient while undermining medical appropriateness. No student in this case will be asked to make clinical triage decisions.","A patient experience manager has another concern. Patients often do not know whether their request was received, what the next step is, or when they can expect an answer. Staff believe they are being careful about not promising unavailable appointments; patients experience the same caution as a lack of communication.","In a recent employee suggestion survey, one person recommended a centralized call-back queue. Another proposed better training on visit types. A third wanted a tool to summarize referral information before staff review. One handwritten comment, in large letters, read: 'PLEASE STOP CHANGING THE RULES WITHOUT TELLING THE FRONT DESK.'","Many employees are proud of the care provided once patients arrive. The disagreement is about the route to that care: who owns each step, which information can be trusted, and what changes are practical with limited resources."]},{"label":"06 · Decision ahead","title":"A Management Review Without a Preselected Solution","paragraphs":["The outpatient regional director has approved a short management review. There is no authorization to replace the electronic health record, introduce unapproved patient-facing AI systems, or change clinical eligibility rules. Any operational pilot must maintain patient safety, confidentiality and appropriate human review.","The director is willing to consider improvements to scheduling communication, administrative workflow, provider-template coordination, or staff support. AI tools may be useful for analyzing de-identified operational patterns, summarizing non-sensitive administrative messages, or drafting clearer communication for human approval. The organization is not seeking an algorithm that diagnoses patients or decides who deserves medical attention.","A limited pilot budget is available, but staff are already preparing for winter illnesses and end-of-year scheduling. Some physicians are reluctant to change appointment templates during a busy period. Several employees remember an earlier scheduling improvement effort that produced a new set of forms but few lasting changes. A report on that effort has not yet been released to the management team.","The director has asked the temporary Access Improvement Review Team to identify a priority organizational problem using the available records. Later evidence may confirm, complicate or challenge the initial assessment.","The question is not whether Harbor View could use more technology. It is whether leaders understand how its existing system works well enough to improve access without creating new risks."]}],"people":[{"id":"marcus","name":"Dr. Marcus Hill","role":"Medical Director, Outpatient Services","tag":"Clinical leadership","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XG 5","Positive","Dermatology","I was offered a cancellation spot and got in the next morning. Everything went smoothly."],["PV-044","Oct 18","Transportation","Cardiology","The earlier office is too far by bus. The local appointment is five weeks away. That is a hard choice when I have to coordinate a ride."],["PV-051","Oct 20","Callback","Orthopedics","I received an automated text saying the request was being reviewed. I could not tell whether I had an appointment."],["PV-056","Oct 22","Phone","Primary care","I was on hold during my lunch break, so I hung up. I know the clinic is busy; I just cannot call repeatedly while at work."],["PV-062","Oct 24","Positive","Gastroenterology","The nurse and scheduling coordinator worked together to sort out my visit. It took longer to book but I felt listened to."],["PV-069","Oct 25","Online","Dermatology","I expected the appointment search to show all locations, but it looked like only two doctors were available."],["PV-073","Oct 26","Follow-up","Primary care","The clinician said to schedule a follow-up in a month. The next time offered to me was much later. I am not sure whether I should call the office again."]],"observations":[["Oct 4","Front desk printer unavailable for 20 minutes","Backup instruction sheets used; no canceled visits recorded"],["Oct 7","Specialty call queue reached 32 waiting callers","Queue included status inquiries and new requests"],["Oct 9","Provider requested a schedule-template adjustment","Some blocks temporarily withheld from general scheduling"],["Oct 12","A same-day cancellation was successfully filled","Staff called a patient who had requested a flexible time"],["Oct 14","Online request initially used the wrong visit type","Patient notified and rebooked after review"],["Oct 17","A language assistance request took two transfers","The patient eventually received an appointment"],["Oct 19","Referral status was unclear for three days","Multiple employees handled the request"],["Oct 21","An afternoon ap ovided"],["Oct 15 · 10:06 AM","Cancellation recorded","Eligible slot released"],["Oct 15 · 10:20 AM","Agent calls back","Patient accepts next-day visit"]],"insight":"This successful case shows the system can match some patients to newly available capacity; not every pathway fails."},{"id":"AX-133","title":"An appointment that could not fit a commute","line":"Primary care","channel":"Phone","status":"Later appointment accepted","duration":"21 calendar days","events":[["Oct 9 · 12:15 PM","Patient requests","Needs an evening time"],["Oct 9 · 12:23 PM","Earlier time offered","Work schedule prevents attendance"],["Oct 9 · 12:27 PM","Evening option found","Booked three weeks later"]],"insight":"A technically open appointment may not be practically accessible to a patient."},{"id":"AX-141","title":"The duplicate callback","line":"Gastroenterology","channel":"Phone + portal message","status":"Resolved after multiple contacts","duration":"3 business days","events":[["Oct 20 · 9:45 AM","Phone request","Call-back ticket created"],["Oct 20 · 11:04 AM","Portal message","Second request entered separately"],["Oct 21 · 2:15 PM","Two agents respond","Different instructions provided"],["Oct 23 · 8:44 AM","Supervisor consolidates","One request closed; appointment booked"]],"insight":"Multiple contacts can be symptoms of communication and record coordination problems rather than more unique patients."},{"id":"AX-150","title":"A reserved opening","line":"Cardiology","channel":"Internal referral","status":"Appropriate hold maintained","duration":"Not yet bookable","events":[["Oct 23 · 7:30 AM","Provider template check","Block reserved for special follow-up"],["Oct 23 · 10:22 AM","General inquiry","Agent cannot offer reserved block"],["Oct 24 · 3:15 PM","Clinic review","Hold retained pending clinical assessment"]],"insight":"A held appointment should not automatically be treated as unused capacity available for general booking."}],"specialties":[{"id":"pc","name":"Primary Care","new":[80, function panel(title,body,minor=''){return `<section class="panel"><div class="panel-header"><strong>${title}</strong>${minor?`<small>${minor}</small>`:''}</div>${body}</section>`}
function barSvg(series,mode='line'){const w=580,h=185,lo=Math.min(...series),hi=Math.max(...series),delta=hi-lo||1;const coords=series.map((v,i)=>[44+i*(w-81)/Math.max(1,series.length-1),h-34-(v-lo)/delta*104]);let pts=coords.map(a=>a.join(',')).join(' ');return `<svg class="graph-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Operational trend across four reporting weeks">${[0,1,2,3].map(i=>`<line x1="35" y1="${25+i*39}" x2="${w-27}" y2="${25+i*39}" stroke="#e6edf3" stroke-dasharray="4 5"/>`).join('')}${mode==='area'?`<polygon points="${coords[0][0]},${h-29} ${pts} ${coords[coords.length-1][0]},${h-29}" fill="#dbf0f1" opacity=".8"/>`:''}<polyline points="${pts}" fill="none" stroke="#1c819c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${coords.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="5.5" stroke="white" stroke-width="2.5" fill="#c92852"/><text x="${x}" y="${y-13}" text-anchor="middle" font-size="11" font-weight="700" fill="#355e78">${series[i]}</text><text x="${x}" y="${h-10}" text-anchor="middle" font-size="10" fill="#8093a4">W${i+1}</text>`).join('')}</svg>`}
function hero(){return `<section class="hero"><div class="hero-copy"><span class="case-tag">CASE FILE 03 · OUTPATIENT OPERATIONS</span><h1>The Appointment<br>Nobody Can Get</h1><p>Patients wait weeks for care. Some appointment blocks remain unfilled. What is happening between a request and a visit?</p><div class="hero-meta"><span>NORTHERN NEW JERSEY</span><span>REVIEW · NOVEMBER 2026</span></div></div><div class="hero-art" role="img" aria-label="Clinician speaking with an older adult in an outpatient setting"></div></section>`}
function tile(k,title,text,image){let inner='';if(image==='staff')inner=`<div class="tile-art staff">${C.people.map(p=>`<img src="${p.img}" alt="" loading="lazy">`).join('')}</div>`;else if(image==='holds')inner=`<div class="tile-art holds"><b>709</b><b style="color:#ad7624">64</b><b style="color:#168d88">37</b></div>`;else if(image==='documents')inner=`<div class="tile-art docs">▤</div>`;else if(image==='journey')inner=`<div class="tile-art diagram"><svg width="90%" height="77" viewBox="0 0 320 77"><path d="M30 40H290" stroke="#9bc7d3" stroke-width="3" stroke-dasharray="7 6"/>${[30,117,204,290].map((x,i)=>`<circle cx="${x}" cy="40" r="15" stroke="${i===2?'#cb4164':'#6fb4c7'}" stroke-width="3" fill="#fff"/><text x="${x}" y="45" text-anchor="middle" fill="#315e78" font-size="12">${i+1}</text>`).join('')}</svg></div>`;else inner=`<div class="tile-art photo" style="background-image:url('${image}')"></div>`;return `<a class="tile" href="#${k}">${inner}<div class="tile-body"><h3>${esc(title)}</h3><p>${esc(text)}</p><span>OPEN SECTION ↗</span></div></a>`}
function quickBars(){const mx=Math.max(...C.specialties.map(x=>x.next));return C.specialties.map(s=>`<div class="bar-row"><span>${esc(s.name)}</span><div class="bar-track"><i class="bar-fill" style="width:${s.next/mx*100}%"></i></div><b class="bar-value">${s.next.toFixed(1)}d</b></div>`).join('')}

function story(){const x=C.chapters[chapter];return wrap(`${head('Inside Harbor View','An unfolding account of scheduling, clinical operations, patient communications and the ordinary details of running an outpatient center.','PART I · CASE NARRATIVE')}<div class="story-layout"><aside class="panel chapter-list" aria-label="Story chapters">${C.chapters.map((ch,i)=>`<button data-chapter="${i}" class="${i===chapter?'active':''}" ${i===chapter?'aria-current="true"':''}>${esc(ch.label)}<br><span style="font-size:10px;color:#8ba0af">${esc(ch.title)}</span></button>`).join('')}</aside><article class="panel chapter-body"><span class="eyebrow">${esc(x.label)}</span><h2>${esc(x.title)}</h2>${x.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="chapter-buttons">${chapter>0?`<button data-chapter="${chapter-1}" class="outline-btn">← Previous chapter</button>`:'<span></span>'}${chapter<C.chapters.length-1?`<button data-chapter="${chapter+1}" class="primary-btn">Next chapter →</button>`:`<a class="primary-btn" href="#people">Meet the leaders →</a>`}</div></article></div>`)}
function people(){return wrap(`${head('People & Perspectives','Each leader holds an incomplete view. Read their professional background, interpretations and limits before deciding which claims deserve the most weight.','PART II · PERSONNEL DIRECTORY')}<div class="people-grid">${C.people.map(p=>`<button class="person-card" data-person="${p.id}"><img src="${p.img}" alt="Portrait of ${esc(p.name)}" loading="lazy"><div class="person-info"><span class="role-class">${esc(p.tag)}</span><strong>${esc(p.name)}</strong><p>${esc(p.role)}</p></div><span class="view">OPEN PROFILE ↗</span></button>`).join('')}</div><div class="note">These five people work with different parts of the same scheduling system. Their statements should be treated as perspectives, not independently verified conclusions.</div>`)}
function feedbackCards(rows){return rows.map(f=>`<article class="feedback-card"><div class="feedback-meta"><span>${esc(f[0])} · ${esc(f[1])}</span><span class="pill ${f[2]==='Positive'?'positive':''}">${esc(f[2])}</span></div><div style="color:#6b879a;font-weight:750;font-size:10px;margin-bottom:8px">${esc(f[3])}</div><p>“${esc(f[4])}”</p></article>`).join('')||`<div class="message-empty">No comments match this search.</div>`}
function voices(){const cats=['All','Phone','Online','Language','Transportation','Follow-up','Positive'];const rows=C.feedback.filter(f=>(filter==='All'||f[2]===filter||f[2].toLowerCase().includes(filter.toLowerCase()))&&[...f].join(' ').toLowerCase().includes(query.toLowerCase()));return wrap(`${head('What Patients Are Saying','These selected, de-identified experience records represent different kinds of encounters, including successful appointments and unresolved questions.','PART III · PATIENT EXPERIENCE')}<div class="evidence-top"><div class="filter-group">${cats.map(c=>`<button class="filter ${filter===c?'active':''}" data-filter="${c}">${esc(c)}</button>`).join('')}</div><input id="feedback-search" class="search-input" placeholder="Search comments or services" aria-label="Search patient feedback" value="${esc(query)}"></div><p style="font-size:11px;color:#8495a7;margin-bottom:12px" id="feedback-count">Showing ${rows.length} of ${C.feedback.length} selected comments</p><div class="feedback-list" id="feedback-cards">${feedbackCards(rows)}</div><div class="note"><strong>Source caution:</strong> Selection is not random. Feedback should not be treated as a representative patient satisfaction survey. These entries do not include identifiable patient records.</div>`)}
function journeys(){const r=C.requests.find(x=>x.id===request)||C.requests[0];return wrap(`${head('Patient Request Paths','Investigate how six scheduling requests moved through the center. A completed request is not always a completed appointment.','PART IV · REQUEST INVESTIGATION')}<div class="path-layout"><section class="panel request-list">${C.requests.map(x=>`<button class="request-btn ${x.id===r.id?'active':''}" data-request="${x.id}"><small>${esc(x.id)} · ${esc(x.line)}</small><strong>${esc(x.title)}</strong><span>${esc(x.status)}</span></button>`).join('')}</section><article class="panel request-detail"><span class="eyebrow">REQUEST ${esc(r.id)} · SELECTED RECORD</span><h2>${esc(r.title)}</h2><span class="pill warning">${esc(r.status)}</span><div class="factlets"><div><small>Service</small><strong>${esc(r.line)}</strong></div><div><small>Channel</small><strong>${esc(r.channel)}</strong></div><div><small>Reported elapsed time</small><strong>${esc(r.duration)}</strong></div></div><h3 style="font-size:14px;margin-bottom:20px">Recorded sequence</h3><div class="timeline">${r.events.map(([time,title,desc])=>`<div class="timeline-row"><time>${esc(time)}</time><b>${esc(title)}</b><p>${esc(desc)}</p></div>`).join('')}</div><div class="interpretation"><strong>What this record establishes — and what it does not:</strong><br>${esc(r.insight)}</div></article></div><div class="note">All request IDs, timestamps and circumstances are classroom records. Clinical urgency is determined by appropriate health professionals; administrative records alone cannot establish medical necessity.</div>`)}
function capacityStats(){let sets=[];for(const s of C.specialties){if(specialty!=='all'&&specialty!==s.id)continue;if(visit==='both'||visit==='new')sets.push(s.new);if(visit==='both'||visit==='follow')sets.push(s.follow)};return sets.reduce((acc,a)=>acc.map((v,i)=>v+a[i]),[0,0,0,0])}
function capacity(){const [total,booked,held,open]=capacityStats();return wrap(`${head('Appointment Capacity Explorer','Explore a selected four-week calendar snapshot. Compare different appointment types and ask what the labels do — and do not — mean.','PART V · SCHEDULING CAPACITY')}<section class="panel"><div class="pad"><div class="schedule-controls"><label>SPECIALTY<select id="specialty-select"><option value="all" ${specialty==='all'?'selected':''}>All specialties</option>${C.specialties.map(s=>`<option value="${s.id}" ${specialty===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>APPOINTMENT TYPE<select id="visit-select"><option value="both" ${visit==='both'?'selected':''}>All visit types</option><option value="new" ${visit==='new'?'selected':''}>New patient</option><option value="follow" ${visit==='follow'?'selected':''}>Follow-up</option></select></label></div><div class="capacity-grid"><div class="capacity-box booked"><small>Booked blocks</small><strong>${booked}</strong><i>${(booked/total*100).toFixed(1)}% of ${total}</i></div><div class="capacity-box held"><small>Reserved / restricted</small><strong>${held}</strong><i>${(held/total*100).toFixed(1)}% of ${total}</i></div><div class="capacity-box open"><small>Nominally open</small><strong>${open}</strong><i>${(open/total*100).toFixed(1)}% of ${total}</i></div></div><div class="stacked" role="img" aria-label="${booked} booked, ${held} reserved or restricted, ${open} nominally open out of ${total} appointment blocks"><span class="booked" style="width:${booked/total*100}%"></span><span class="held" style="width:${held/total*100}%"></span><span class="open" style="width:${open/total*100}%"></span></div><div class="legend"><span><b class="b"></b>Booked</span><span><b class="h"></b>Reserved / restricted</span><span><b class="o"></b>Nominally open</span></div><p class="capacity-note">Snapshot: selected clinic appointment blocks, scheduled for a future four-week period. Categories are mutually exclusive. A held block may be reserved for a specific appointment type, clinician or review process; an open block may not match a patient's medical, geographic or scheduling needs. This summary does not identify individual patients or clinicians.</p></div></section><div class="section-line"><div><h2>Specialty-by-visit matrix</h2><p>Ten rows across five services. Choose a filter above to investigate one service.</p></div></div>${panel('APPOINTMENT BLOCK STATUS',`<div class="table-scroll"><table class="data-table"><thead><tr><th>Specialty</th><th>Visit type</th><th class="numeric">Total</th><th class="numeric">Booked</th><th class="numeric">Held</th><th class="numeric">Open</th><th class="numeric">Open %</th></tr></thead><tbody>${C.specialties.filter(s=>specialty==='all'||specialty===s.id).flatMap(s=>[['New patient',s.new,'new'],['Follow-up',s.follow,'follow']].filter(r=>visit==='both'||visit===r[2]).map(([type,a])=>`<tr><td><b>${esc(s.name)}</b></td><td>${type}</td><td class="numeric">${a[0]}</td><td class="numeric">${a[1]}</td><td class="numeric">${a[2]}</td><td class="numeric">${a[3]}</td><td class="numeric">${(a[3]/a[0]*100).toFixed(1)}%</td></tr>`)).join('')}</tbody></table></div>`)}<div class="note">This is an aggregated scheduling-status exhibit, not the Week 11 raw dataset. It should not be used to infer that any individual patient could be safely placed into any recorded opening.</div>`)}
function reports(){const metricLabels={'wait':['Reported median days to first offered appointment','wait'], 'requests':['Requests received','requests'], 'scheduled':['Requests scheduled','scheduled'], 'complaints':['Patient service concerns','complaints'], 'abandoned':['Call abandonment rate (%)','abandoned']};const [mLabel,key]=metricLabels[trend];return wrap(`${head('Operations & Internal Evidence','Initial aggregate indicators, reporting conventions and everyday operational observations. Detailed raw scheduling records will be released later.','PART VI · OPERATING RECORDS')}<div class="metrics-grid">${panel('WEEKLY ACCESS TRACKER',`<div class="metric-trend"><span style="font-weight:800;color:#2b5777;font-size:13px">${mLabel}</span><div class="metric-trend-controls">${Object.entries(metricLabels).map(([id,[label]])=>`<button data-trend="${id}" class="switch ${trend===id?'active':''}">${esc(label.replace('Reported median days to first offered appointment','Wait').replace('Requests received','Requests').replace('Requests scheduled','Booked').replace('Patient service concerns','Concerns').replace('Call abandonment rate (%)','Abandoned'))}</button>`).join('')}</div>${barSvg(C.weekly.map(w=>w[key]),'area')}<p class="bar-note">Weekly values count requests, not necessarily unique patients. An appointment offered is not equivalent to a completed visit. Trends do not prove causation.</p></div>`)}${panel('REPORTING DEFINITIONS',`<div class="pad" style="font-size:12px;line-height:1.7;color:#567386"><p><b>Request:</b> recorded scheduling interaction; a single patient may generate multiple requests.</p><p><b>Scheduled:</b> requests that reached a confirmed appointment status during the reporting window.</p><p><b>First-offered wait:</b> days until the earliest eligible time offered by an agent or channel. Not necessarily the day the patient ultimately accepts.</p><p><b>Abandonment:</b> calls disconnected before reaching an agent; not evidence of poor care after a visit.</p><p><b>Appointment block:</b> a scheduling-template unit; it may be reserved, restricted, booked, or open.</p></div>`)}</div><div class="section-line"><div><h2>Selected operational notes</h2><p>Routine observations are neither a complete audit nor a list of proven causes.</p></div></div>${panel('OPERATIONS JOURNAL · OCTOBER',`<div class="table-scroll"><table class="data-table"><thead><tr><th>Date</th><th>Observed event</th><th>Context</th></tr></thead><tbody>${C.observations.map(([a,b,c])=>`<tr><td style="white-space:nowrap"><b>${esc(a)}</b></td><td>${esc(b)}</td><td>${esc(c)}</td></tr>`).join('')}</tbody></table></div>`)}<div class="section-line"><div><h2>Four-week summary</h2><p>This is an aggregated report, not patient-level source data.</p></div></div>${panel('ACCESS & CONTACT SUMMARY',`<div class="table-scroll"><table class="data-table"><thead><tr><th>Reporting period</th><th class="numeric">Requests</th><th class="numeric">Scheduled</th><th class="numeric">First-offered wait</th><th class="numeric">Concerns</th><th class="numeric">Abandonment</th></tr></thead><tbody>${C.weekly.map(w=>`<tr><td>${esc(w.week)}</td><td class="numeric">${fmt(w.requests)}</td><td class="numeric">${fmt(w.scheduled)}</td><td class="numeric">${w.wait.toFixed(1)}d</td><td class="numeric">${w.complaints}</td><td class="numeric">${w.abandoned.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`)}<div class="note">The team has not yet received the raw appointment request dataset, the complete workflow/SOP, the staffing and capacity report, or the financial/resource report. Those documents are not included in this initial file.</div>`)}
function constraints(){return wrap(`${head('Decision Boundaries','Before choosing technology or redesigning work, examine the limits on financial authority, administrative changes and patient-safety safeguards.','PART VII · MANAGEMENT PARAMETERS')}<div class="constraints-banner"><div><small>PROVISIONAL ADDITIONAL PILOT BUDGET</small><strong>$95,000</strong><small>Ceiling; no obligation to spend full amount</small></div><div><small>INITIAL REVIEW & PILOT HORIZON</small><strong>90 days</strong><small>No assumption of additional clinician hours</small></div></div>${panel('CURRENT MANAGEMENT CONDITIONS',`<div>${C.constraints.map(([a,b])=>`<div class="constraint-row"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>`)}<div class="note"><strong>Clinical boundary:</strong> The assignment is about administrative service improvement. Students should not diagnose patients, rank individuals by medical urgency, or propose using real patient data in unapproved AI systems.</div>`)}
function updates(){return wrap(`${head('Management Updates','Each release adds evidence without erasing earlier decisions. Students should revisit their previous reasoning as more information becomes available.','EVIDENCE RELEASE CENTER')}<div>${C.release.map(([w,t,d,available])=>`<div class="release ${available?'current':''}"><div class="week">WEEK ${w}</div><div style="flex:1"><h3>${esc(t)}</h3><p>${esc(d)}</p></div><span class="status">${available?'AVAILABLE':'NOT YET RELEASED'}</span></div>`).join('')}</div><div class="note">Future datasets and unexpected developments are not contained in this website package until they are officially published. All student teamwork and worksheet submissions remain in Canvas.</div>`)}
function personModal(id){const p=C.people.find(x=>x.id===id);if(!p)return;overlay.innerHTML=`<div class="overlay" data-close><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(p.name)} profile"><button class="modal-close" data-close aria-label="Close profile">×</button><div class="modal-hero"><img src="${p.img}" alt="Generated portrait of ${esc(p.name)}"><div><span class="eyebrow">${esc(p.tag)}</span><h2>${esc(p.name)}</h2><p>${esc(p.role)}</p></div></div><div class="modal-body"><div class="modal-facts"><div><b>EXPERIENCE</b>${esc(p.tenure)}</div><div><b>MAIN RESPONSIBILITIES</b>${esc(p.focus)}</div></div><div class="quote">“${esc(p.quote)}”</div><h3>What this person sees</h3><p>${esc(p.detail)}</p><h3>A limitation worth considering</h3><p>${esc(p.blind)}</p><div class="interpretation"><b>Question for the management team:</b><br>${esc(p.question)}</div><p class="directory-note">Profile and portrait prepared for the classroom simulation.</p></div></section></div>`;document.body.style.overflow='hidden';overlay.querySelector('.modal-close').focus()}
function searchModal(){let targets=[...routes.map(([id,title])=>({title,type:'Section',to:id})),...C.people.map(p=>({title:p.name,type:p.role,to:'people'})),...C.requests.map(r=>({title:r.title,type:r.id,to:'journeys'}))];overlay.innerHTML=`<div class="overlay" data-close><section class="modal search-modal" role="dialog" aria-modal="true" aria-label="Search case file"><button class="modal-close" data-close aria-label="Close search">×</button><h2>Search case materials</h2><input id="globalSearch" autofocus placeholder="Search sections, people and request histories" aria-label="Search case materials"><div id="globalResults" style="margin-top:10px">${targets.map(t=>`<a href="#${t.to}" class="search-result">${esc(t.title)}<small>${esc(t.type)}</small></a>`).join('')}</div></section></div>`;document.body.style.overflow='hidden';overlay.querySelector('input').focus();overlay.dataset.targets=JSON.stringify(targets)}
function closeModal(){overlay.innerHTML='';document.body.style.overflow=''}
const views={home:homepage,story,people,journeys,voices,capacity,reports,constraints,updates};
function render(){const path=location.hash.slice(1)||'home',page=views[path]?path:'home';navRender(page);main.innerHTML=views[page]();nav.classList.remove('open');const shade=document.getElementById('navShade');if(shade)shade.remove();document.getElementById('menuToggle').setAttribute('aria-expanded','false');document.title=`${routes.find(r=>r[0]===page)?.[1]||'Access Overview'} | Harbor View Review`;window.scrollTo(0,0)}
function rerenderKeepPosition(){const y=window.scrollY;const page=location.hash.slice(1)||'home';main.innerHTML=(views[page]||homepage)();window.scrollTo(0,y)}
window.// Keep the current case page active when Skip to content is selected.
document.addEventListener('click', event => {
 const skipLink = event.target.closest('a[href="#main"]');
 if (!skipLink) return;
 event.preventDefault();
 const target = document.getElementById('main');
 if (target) {
   target.focus({preventScroll:true});
   target.scrollIntoView({block:'start'});
 }
});
addEventListener('hashchange',()=>{closeModal();render()});document.addEventListener('click',e=>{
 if(e.target.closest('[data-close]')){if(e.target.closest('.modal')&&!e.target.closest('button[data-close]'))return;closeModal();return}
 const p=e.target.closest('[data-person]');if(p){personModal(p.dataset.person);return}
 const ch=e.target.closest('[data-chapter]');if(ch){chapter=Number(ch.dataset.chapter);rerenderKeepPosition();return}
 const r=e.target.closest('[data-request]');if(r){request=r.dataset.request;rerenderKeepPosition();return}
 const fil=e.target.closest('[data-filter]');if(fil){filter=fil.dataset.filter;query='';rerenderKeepPosition();return}
 const tr=e.target.closest('[data-trend]');if(tr){trend=tr.dataset.trend;rerenderKeepPosition();return}
 if(e.target.closest('#openSearch')){searchModal();return}
 if(e.target.closest('#menuToggle')){const a=nav.classList.toggle('open');document.getElementById('menuToggle').setAttribute('aria-expanded',String(a));if(a){let d=document.createElement('div');d.id='navShade';d.className='mobile-dim';d.addEventListener('click',()=>{nav.classList.remove('open');d.remove()});document.body.appendChild(d)}else document.getElementById('navShade')?.remove();return}
});
document.addEventListener('change',e=>{if(e.target.id==='specialty-select'){specialty=e.target.value;rerenderKeepPosition()}if(e.target.id==='visit-select'){visit=e.target.value;rerenderKeepPosition()}});
document.addEventListener('input',e=>{if(e.target.id==='feedback-search'){query=e.target.value;const rows=C.feedback.filter(f=>(filter==='All'||f[2]===filter||f[2].toLowerCase().includes(filter.toLowerCase()))&&[...f].join(' ').toLowerCase().includes(query.toLowerCase()));document.getElementById('feedback-cards').innerHTML=feedbackCards(rows);document.getElementById('feedback-count').textContent=`Showing ${rows.length} of ${C.feedback.length} selected comments`}if(e.target.id==='globalSearch'){const targets=JSON.parse(overlay.dataset.targets||'[]');const matches=targets.filter(t=>[t.title,t.type].join(' ').toLowerCase().includes(e.target.value.toLowerCase()));document.getElementById('globalResults').innerHTML=matches.map(t=>`<a href="#${t.to}" class="search-result">${esc(t.title)}<small>${esc(t.type)}</small></a>`).join('')||'<p class="message-empty">Nothing matched your search.</p>'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal()}});
render();
})();
</script>
