<div class="shell"><aside id="sidebar" class="sidebar" aria-label="Case navigation"></aside><main id="main" class="main" tabindex="-1"></main></div><div id="overlay"></div><noscript>Please enable JavaScript to explore the case documents.</noscript><script>window.NJT_CASE = {
  title:'The Train Is Late. The Message Is Later.',
  facility:'North Jersey Passenger Information Coordination Review',
  review:'November 2026',
  intro:'Across commuter rail lines, a train can be delayed for one reason while a traveler loses confidence for another. The operations team has been asked to investigate what happens between knowing about a disruption and helping someone navigate it.',
  chapter:[
    {title:'6:47 A.M. — A commuter checks the board',sub:'Newark Penn Station · Tuesday, October 20',body:[
      'At Newark Penn Station, a man in a charcoal coat stops beneath the departure board and checks his watch. The platform is already crowded, but the coffee kiosk is still moving customers through its line. A commuter has folded a newspaper under one arm. Two students argue quietly about whether a bus might be faster. The board shows a departure time that is approaching, though people near the stairs have begun to whisper that the train may be held farther down the line.',
      'At 7:42 a.m., a service control employee records an operating issue affecting inbound movement. The cause is not yet fully confirmed. A field representative is trying to verify the location of an affected train, and an operator is discussing whether a temporary hold is necessary. At the station, the departure board continues to display an expected time. Meanwhile a station employee hears a radio exchange that is not meant for passengers.',
      'A woman traveling to an interview in Manhattan refreshes the NJ TRANSIT app. Her notification preferences are set to one particular train. She does not see a new message. Another rider says she saw a different update in a group chat. By the time a fuller station announcement is delivered, some commuters have already changed their travel plans.',
      'The train does eventually move. Nobody disputes that the original operating problem mattered. But later, when the complaint office compares the technical incident report with rider accounts, the two narratives appear to begin and end at different times.'
    ]},
    {title:'The team responsible for information',sub:'One network, several audiences',body:[
      'NJ TRANSIT passengers encounter service information through a mix of station displays, announcements, digital tools, text or email notifications, customer service representatives, and sometimes the guidance of employees standing nearby. These channels do not have exactly the same workflow or update cycle. They also do not necessarily reach the same people.',
      'For this review, the fictional North Jersey coordination team supports passenger information during selected rail disruptions. The team works alongside transportation operations but does not control every decision made by dispatchers, crews, station employees, accessibility coordinators, and communications specialists.',
      'A dispatcher may know that traffic is moving slowly without knowing how long a delay will last. A communications editor may need a verified location and estimated impact before writing a public alert. A station agent may have the most immediate account of what passengers are hearing but lack access to the same software used by central operations.',
      'Managers do not agree on which uncertainty should be shared. One argues that an early incomplete notice is better than silence. Another worries that an inaccurate notice will cause unnecessary passenger movement and further confusion. A third questions whether the organization is measuring the time it takes to deliver useful information at all.'
    ]},
    {title:'A Wednesday of ordinary frustrations',sub:'Elizabeth, Secaucus Junction, Morristown',body:[
      'A passenger at Elizabeth station says she checked the app three times and walked toward the wrong platform before a revised announcement reached her. At Secaucus Junction, a customer service employee notes that riders with tight connections often ask for advice that depends on information from more than one train line. In Morristown, an older rider says the platform display was technically correct but gave little help deciding whether to remain at the station.',
      'Not every complaint is about a delayed train. One rider mentions the glare on an electronic display in the afternoon sun. Another remembers an announcement that was difficult to hear near a passing train. A frequent commuter says she prefers email alerts because she does not use the mobile app. A passenger who is comfortable with technology says the app is useful but the messages are too vague when he has to choose an alternative route.',
      'A station supervisor points out that commuters often compare official information with what they hear from other riders. Rumors can spread fast. Some are wrong; others happen to be right before an official message appears. No one has yet measured how those unofficial signals change trust in the system.',
      'The facilities unit recently replaced a damaged sign at one station. A train crew was praised for helping a traveler make a connection. A new coffee stand opened near an entrance. These events were included in routine station notes but have not been linked to the service information concerns.'
    ]},
    {title:'The report that looked encouraging',sub:'Performance review meeting · October 30',body:[
      'A regional performance review begins with good news: the share of selected trains arriving within the internal on-time reporting threshold has improved across the four recent reporting periods. Completed service volumes are stable. The team has been working hard, and several operating supervisors feel the numbers demonstrate progress.',
      'The customer experience office presents a different set of indicators. Complaints coded as service-information-related have increased. The reported median number of minutes between the initial incident log and the first public notice has also increased. Some managers object that not every incident requires a message and that the timestamp can depend on which system generated the record.',
      'The data lead acknowledges those objections. The summary combines different corridors and event types, while complaints are coded from the words that riders choose to use. More riders contacting the organization could reflect changing behavior, not simply worsening communication. The service-information team has asked for event-level records, but those files are still being prepared.',
      'The finance representative reminds everyone that the holiday travel period is approaching. The organization must maintain day-to-day service and cannot introduce a major new platform overnight. A pilot that is narrow enough to monitor may be realistic; a sweeping overhaul probably is not.'
    ]},
    {title:'The alerts that did not tell the same story',sub:'When one incident becomes five messages',body:[
      'One selected October incident appears in an operating log, a station announcement record, a digital message queue, a customer service note, and two rider complaints. Each source identifies the same event, but the chronology changes depending on whether the analyst measures the time a problem was observed, recorded, confirmed, drafted, released, or received.',
      'A station employee remembers announcing a hold before the digital alert was visible on the app. A digital communications specialist points to a different event where the app was updated sooner than the station display. Both believe their examples prove something about the current process. Neither example is sufficient on its own to represent the entire network.',
      'At another station, a service notice successfully described a delay but did not clearly state what a passenger using a mobility device should do when an elevator was temporarily unavailable. That complaint concerns the usability of a message, not only its speed.',
      'A customer relations specialist asks an uncomfortable question: “Are we celebrating trains that recover quickly while ignoring passengers who have already missed their connection?” The room falls quiet. The project team is told to examine the evidence rather than endorse one department’s explanation.'
    ]},
    {title:'A decision before the holiday peak',sub:'The management review mandate',body:[
      'Leadership has authorized an initial improvement review involving passenger information for selected rail corridors in North Jersey. The organization wants a practical response to reported information gaps without weakening transportation safety or placing unauthorized automation into operational control.',
      'There are several possibilities. Teams might review how information moves from dispatch to public-facing channels, improve decision rules about what can be communicated under uncertainty, examine whether different riders receive usable information, or test administrative AI tools against sample communications. None of these approaches has been approved as the correct solution.',
      'There is also a history of a previous passenger information pilot that employees describe differently. Some say it ended because the underlying data were unreliable; others blame limited training. The archived evaluation is being located but is not part of the first evidence release.',
      'The regional director wants the team to identify one important organizational problem, specify what the current evidence can and cannot support, and explain what additional information would be needed before implementing change. A proposal must distinguish transport operations from passenger communication—and should acknowledge that the two may interact.'
    ]}

const fmt=n=>Number(n).toLocaleString('en-US');
function navView(page){sidebar.innerHTML=`<div class="side-inner"><div class="side-case"><span class="case-id">MANAGEMENT REVIEW / 04</span><h2>The Train Is Late.<br>The Message Is Later.</h2><p>North Jersey passenger information<br>November 2026</p></div><div class="side-label">CASE MATERIALS</div>${routes.map(([k,t,i])=>`<a class="side-link ${page===k?'active':''}" href="#${k}" ${page===k?'aria-current="page"':''}><span class="ico" aria-hidden="true">${i}</span>${esc(t)}</a>`).join('')}<a class="side-link" href="./dissent-inbox.html"><span aria-hidden="true">✉</span><span>Dissent Inbox</span></a></div>`}
function footer(){return `<footer class="foot"><span>NORTH JERSEY · PASSENGER INFORMATION REVIEW · CASE 04</span><span>Educational simulation. All case-specific data, event records, staff profiles and rider statements are invented. Not a live NJ TRANSIT service portal or official alert channel.</span></footer>`}
function wrap(s){return `<div class="wrap">${s}${footer()}</div>`}
function head(title,subtitle,kicker='CASE FILE 04'){return `<div class="content-head"><span class="eyebrow">${kicker}</span><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>`}
function panel(title,body,small=''){return `<section class="panel"><div class="panel-title"><b>${title}</b>${small?`<small>${small}</small>`:''}</div>${body}</section>`}
function hero(){return `<section class="hero"><div class="hero-content"><div class="eyebrow">CASE FILE 04 · SERVICE INFORMATION</div><h1>The Train Is Late.<br>The Message Is Later.</h1><p>${esc(C.intro)}</p><div class="hero-line"><span>NORTH JERSEY RAIL CORRIDORS</span><span>INITIAL REVIEW · NOV 2026</span></div></div></section>`}
function card(route,icon,title,desc){return `<a class="home-card" href="#${route}"><span class="home-card-icon">${icon}</span><span><h3>${esc(title)}</h3><p>${esc(desc)}</p></span></a>`}
function miniMetric(label,value,trend,good){return `<div class="mini-metric"><label>${esc(label)}</label><strong>${esc(value)}</strong><small class="${good?'positive':'negative'}">${esc(trend)}</small></div>`}
function spark(vals,width=510,height=175,key){let mn=Math.min(...vals),mx=Math.max(...vals),delta=mx-mn||1;let pts=vals.map((v,i)=>[32+i*(width-60)/(vals.length-1),height-34-((v-mn)/delta)*105]);return `<svg class="plot-svg" role="img" aria-label="${esc(key)} across four review periods" viewBox="0 0 ${width} ${height}">${[0,1,2,3].map(i=>`<line x1="26" x2="${width-20}" y1="${25+i*37}" y2="${25+i*37}" stroke="#e6edf2" stroke-dasharray="4 5"/>`).join('')}<polyline fill="none" stroke="#1a709b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="5" fill="#f08c42" stroke="white" stroke-width="2"/><text x="${x}" y="${y-14}" text-anchor="middle" fill="#3a698a" font-size="12" font-weight="800">${vals[i]}</text><text x="${x}" y="${height-9}" text-anchor="middle" font-size="10" fill="#788c9e">${C.periods[i].p}</text>`).join('')}</svg>`}
function preview(){return wrap(`${hero()}<div class="home-row">${panel('INITIAL REVIEW · EIGHT-WEEK COMPARISON',`<div class="strip">${miniMetric('Trains on time','89.8%','↑ 1.7 pp from P1',true)}${miniMetric('Median first notice lag','28 min','↑ 9 minutes from P1',false)}${miniMetric('Notices within 10 min','38%','↓ 14 pp from P1',false)}${miniMetric('Information-related contacts','177','↑ 95 contacts from P1',false)}</div>`,'P4 · OCT 19–NOV 1')}</div><div class="home-row grid-2">${panel('A TALE OF TWO TIMELINES',`<div class="pad"><div class="overline">The operational paradox</div><h2 style="font-size:20px;line-height:1.3;color:#163e69;letter-spacing:-.03em;margin:9px 0">Trains look more punctual. Passengers say information is harder to use.</h2><p style="font-size:12px;color:#6a8091">During the review, the on-time reporting indicator improves while the recorded first-public-notice lag rises. Neither number proves the root cause.</p>${spark(C.periods.map(p=>p.noticeLag),600,176,'Median public notice lag')}<a class="quick-link" href="#metrics">Examine metric definitions ↗</a></div>`,'NOT COMPARABLE TO A RIDER’S EXPERIENCE')}${panel('SELECTED OPERATIONAL QUESTIONS',`<div class="pad"><div class="alert"><b>FIELD NOTE · NEWARK PENN</b>One incident resulted in different message times on a station board, mobile alert and public-address system.</div><div class="alert"><b>TRANSFER EXPERIENCE</b>Some riders report missing connections despite eventual service recovery.</div><div class="alert"><b>ACCESSIBILITY CONCERN</b>General delay advisories may not resolve an individual’s accessible route question.</div><a class="quick-link" href="#investigations">Investigate six events ↗</a></div>`,'OCTOBER FIELD REVIEW')}</div><div class="home-cards">${card('story','▤','Inside the Situation','Six chapters: platform scenes, internal perspectives, operating decisions and ordinary station details.')}${card('investigations','◷','Incident Investigation Board','Open six selected events and compare when different information channels were updated.')}${card('people','♙','Management & Field Voices','Explore five perspectives from operations, communications, station services and data.')}${card('riders','☷','Rider Experience Records','Twelve selected rider statements—including positive experiences and unrelated complaints.')}${card('channels','⇄','Communication Channel Review','Compare how operations logs, station displays, mobile alerts and announcements circulate information.')}${card('documents','▧','Internal Evidence Dossier','Initial reporting summaries, station observations and management boundaries.')}</div><div class="notice"><strong>Starting point:</strong> Treat these summaries as incomplete management evidence. The event-level raw dataset, full staffing records and prior project evaluation are scheduled for later releases and are not embedded here.</div>`)}
function story(){const ch=C.chapter[chapter];return wrap(`${head('The Situation','A series of seemingly ordinary rail-service incidents raises a difficult question: what does it mean to keep a traveler informed?','PART I · CASE NARRATIVE')}<div class="chapters"><div class="chapter-list">${C.chapter.map((x,i)=>`<button data-chapter="${i}" class="chapter-btn ${i===chapter?'active':''}"><span class="num">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(x.title)}</strong><small>${esc(x.sub)}</small></span></button>`).join('')}</div><article class="story-body"><div class="dateline">CHAPTER ${chapter+1} OF ${C.chapter.length} · ${esc(ch.sub)}</div><h2>${esc(ch.title)}</h2>${ch.body.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="story-nav"><button class="navbtn" data-chapter="${chapter-1}" ${chapter===0?'disabled':''}>← Previous</button><button class="navbtn" data-chapter="${chapter+1}" ${chapter===C.chapter.length-1?'disabled':''}>Next chapter →</button></div></article></div>`)}
function people(){return wrap(`${head('People & Perspectives','Everyone works for the same public transportation system. Not everyone sees the same problem, controls the same information, or faces the same consequences.','PART II · LEADERSHIP DIRECTORY')}<div class="person-grid">${C.people.map(p=>`<button class="person-card" data-person="${p.id}"><img src="${p.img}" alt="Portrait of ${esc(p.name)}"><div><strong>${esc(p.name)}</strong><small>${esc(p.role)}</small><span>OPEN PROFILE ↗</span></div></button>`).join('')}</div><div class="grid-2" style="margin-top:20px">${panel('Disagreements worth examining',`<div class="pad"><p>How soon should uncertain information be published? Who is responsible when an alert is sent but not received? Does a report that says an update was issued prove passengers understood it?</p><p>Open each management profile to compare the concerns, blind spots and decision authority of individual stakeholders.</p></div>`)}${panel('Role of the management review team',`<div class="pad"><p>The review team is expected to compare perspectives rather than choose a favored department. You may need to distinguish a reasonable concern from sufficient evidence of a root cause.</p><span class="pill">Initial profiles only · initial</span></div>`)}</div>`)}
const channelCls=t=>({'Operations log':'ops','Field update':'internal','Control update':'internal','Dispatcher note':'internal','Station services':'internal','Station display':'screen','App advisory':'app','Station PA':'pa','Customer contact':'rider'}[t]||'internal');
function investigationList(arr){return arr.map(i=>`<button data-incident="${i.id}" class="incident-btn ${incident===i.id?'active':''}"><b>${esc(i.id)} · ${esc(i.title)}</b><small>${esc(i.date)} · ${esc(i.place)} · ${esc(i.corridor)}</small></button>`).join('')}
function investigations(){const selected=C.incidents.find(x=>x.id===incident)||C.incidents[0],a=C.incidents.filter(x=>eventFilter==='All'||x.corridor===eventFilter);return wrap(`${head('Incident Investigation Board','A service event can leave different traces: an operating note, a display change, an alert, a station announcement and a rider contact. Explore the chronology rather than assuming every timestamp means the same thing.','PART III · EVENT RECORDS')}<div class="toolbar"><label for="eventFilter"><b style="font-size:11px;color:#53718d">SERVICE CORRIDOR</b></label><select id="eventFilter" class="field"><option>All</option>${['Northeast Corridor','Morris & Essex','Raritan Valley'].map(x=>`<option ${eventFilter===x?'selected':''}>${x}</option>`).join('')}</select><span class="pill">${a.length} selected events</span></div><div class="incident-layout"><div class="incident-list">${investigationList(a)}</div>${panel('INCIDENT RECORD · '+selected.id,`<div class="event-detail"><div class="overline">${esc(selected.date)} · ${esc(selected.corridor)} · ${esc(selected.place)}</div><h2>${esc(selected.title)}</h2><p>${esc(selected.summary)}</p><div class="event-timeline">${selected.timeline.map(([t,type,msg])=>`<div class="event-step ${channelCls(type)}"><time>${esc(t)}</time><span class="bubble" aria-hidden="true"></span><div><strong>${esc(type)}</strong><span>${esc(msg)}</span></div></div>`).join('')}</div><div class="case-note"><b>ANALYST’S CAUTION:</b> ${esc(selected.note)}</div><p style="margin-top:15px"><b>Open question:</b> ${esc(selected.issue)}</p></div>`,'SELECTED INCIDENT · NOT THE FULL EVENT DATABASE')}</div><div class="notice"><strong>Scope:</strong> These six selected records illustrate different patterns, including one comparatively coordinated response. They are not a random or representative sample of service incidents.</div>`)}
function channels(){return wrap(`${head('How Information Travels','The same operational disruption can reach riders by different routes. Every channel has strengths, delays and an audience that other channels may not serve.','PART IV · COMMUNICATION WORKFLOW')}<div class="grid-2">${panel('Illustrative information pathway',`<div class="network">${[['▣','Control','Event enters operating logs'],['◈','Review','Facts and impact assessed'],['▥','Boards','Station display system'],['◉','Mobile','App / subscribed alerts'],['☷','People','Staff, riders, assistance']].map(([i,t,s])=>`<div class="network-item"><span class="ico">${i}</span><b>${t}</b><small>${s}</small></div>`).join('')}</div><p class="network-foot">A conceptual pathway, not an official internal NJ TRANSIT systems diagram. Some station actions occur independently or in parallel.</p>`)}${panel('A message that is sent is not necessarily useful',`<div class="pad"><p style="font-size:12px;color:#537089">Each channel answers a different question. A mobile notification can arrive quickly but may not reach someone without the app. A platform sign can be seen without offering a usable alternative. An employee can provide context but may have incomplete information.</p><div class="alert"><b>INVESTIGATION PROMPT</b>Which should matter more: first message sent, first correct message, first passenger seen, or first actionable instruction?</div></div>`)}</div><h2 class="section-heading">Selected event chronology by channel</h2>${panel('CROSS-CHANNEL RECORD EXCERPTS',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Event</th><th>Operations recorded</th><th>First app advisory</th><th>Station display update</th><th>Station PA</th><th>Rider follow-up</th></tr></thead><tbody>${C.incidents.map(i=>{const lookup=type=>i.timeline.find(x=>x[1]===type)?.[0]||'—';return `<tr><td><b>${esc(i.id)}</b><br><small>${esc(i.place)}</small></td><td>${lookup('Operations log')}</td><td>${lookup('App advisory')}</td><td>${lookup('Station display')}</td><td>${lookup('Station PA')}</td><td>${lookup('Customer contact')}</td></tr>`}).join('')}</tbody></table></div>`,'READ IN CONJUNCTION WITH INCIDENT RECORDS')}<div class="notice">Different timestamps represent different types of action. Do not subtract times across records without deciding what event marks the beginning and what counts as useful public communication.</div>`)}
function feedbackCards(arr){return arr.map(f=>`<article class="feedback-card"><div class="feedback-head"><span><b>${esc(f.id)}</b> · ${esc(f.date)}</span><span class="pill ${f.type==='Positive'?'success':f.type==='Accessibility'?'warn':''}">${esc(f.type)}</span></div><blockquote>“${esc(f.quote)}”</blockquote><div class="section-meta">${esc(f.corridor)} · Selected rider statement</div></article>`).join('')}
function riders(){const types=['All',...new Set(C.feedback.map(f=>f.type))],rows=C.feedback.filter(f=>(riderFilter==='All'||f.type===riderFilter)&&[f.id,f.date,f.type,f.corridor,f.quote].join(' ').toLowerCase().includes(riderQuery.toLowerCase()));return wrap(`${head('Rider Experience Records','A mix of frustration, appreciation and ordinary travel details. Selected comments can suggest hypotheses, but cannot substitute for representative rider research.','PART V · CUSTOMER RELATIONS')}<div class="toolbar"><input class="field" id="riderSearch" value="${esc(riderQuery)}" placeholder="Search rider records…" aria-label="Search rider feedback" style="flex:1;min-width:220px"><label for="riderType" style="font-size:11px">COMMENT TYPE</label><select class="field" id="riderType">${types.map(t=>`<option ${t===riderFilter?'selected':''}>${esc(t)}</option>`).join('')}</select><span class="pill" id="feedbackCounter">${rows.length} of ${C.feedback.length} records</span></div><div class="feedback-grid" id="feedbackGrid">${feedbackCards(rows)}</div><div class="notice"><strong>Sampling caveat:</strong> These are purposefully selected illustrative comments. Complaint frequency, comment tone and the number of unique affected riders cannot be estimated from this collection.</div>`)}
function metrics(){const m=C.metrics.find(x=>x.key===metric)||C.metrics[0];let vals=C.periods.map(p=>p[metric]);return wrap(`${head('Service & Communication Metrics','The selected corridor-level performance summary is aggregated across four consecutive two-week reporting periods. It does not identify the cause of any trend.','PART VI · MANAGEMENT REPORTING')}<div class="grid-2">${panel('Performance report · four periods',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Indicator</th>${C.periods.map(p=>`<th class="num">${p.p}<br><small>${p.dates}</small></th>`).join('')}</tr></thead><tbody>${[['trips','Selected train trips',v=>fmt(v)],['onTime','On time (%)',v=>v.toFixed(1)+'%'],['incidents','Logged significant disruptions',v=>v],['noticeLag','Median first public notice lag',v=>v+' min'],['within10','Notices within 10 min (%)',v=>v+'%'],['complaints','Information-related contacts',v=>v],['understood','Guidance clarity, survey (%)',v=>v+'%']].map(([k,t,fn])=>`<tr><td><b>${t}</b></td>${C.periods.map(p=>`<td class="num">${fn(p[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,'EXCERPT · ALL FIGURES CLASSROOM DATA')}${panel('Indicator explorer',`<div class="pad"><label for="metricSelect" style="display:block;font-size:11px;font-weight:800;color:#52718d;margin-bottom:5px">COMPARE REPORTING PERIODS</label><select id="metricSelect" class="field" style="width:100%">${C.metrics.map(x=>`<option value="${x.key}" ${x.key===metric?'selected':''}>${esc(x.label)}</option>`).join('')}</select>${spark(vals,520,210,m.label)}<p style="font-size:11px;color:#61798d"><b>${esc(m.label)}</b> · ${esc(m.desc)}</p></div>`,'CHOOSE ONE REPORTING INDICATOR')}</div><h2 class="section-heading">Routine observations</h2>${panel('SELECTED FIELD AND COORDINATION NOTES',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Observation</th><th>Recorded by</th></tr></thead><tbody>${C.notes.map(([d,s,w])=>`<tr><td>${esc(d)}</td><td>${esc(s)}</td><td>${esc(w)}</td></tr>`).join('')}</tbody></table></div>`)}<div class="notice"><strong>Limitations:</strong> Service punctuality, quality of a public advisory, time of first notification and rider comprehension are different constructs. Voluntary clarity surveys and recorded contacts may involve changing samples.</div>`)}
function documents(){const doc=[['D-01','Case Narrative & Operating Context','Six chapters documenting selected station and management experiences','story'],['D-02','Management Perspectives','Five interviews and stakeholder responsibilities','people'],['D-03','Selected Incident Records','Six selected operational and customer timelines','investigations'],['D-04','Service and Communication Metrics','Four reporting periods with indicator definitions','metrics'],['D-05','Customer Relations Excerpts','Twelve selected rider statements','riders'],['D-06','Coordination Channel Notes','Information flow and cross-channel excerpts','channels'],['D-07','Pilot Constraints','Funding, operational authority and accessibility boundaries','constraints']];return wrap(`${head('Internal Evidence Library','Browse the initial documents by topic. Individual records are not a substitute for the operational source files scheduled for Upcoming.','PART VII · DOCUMENT CONTROL')}<div class="document-grid">${doc.map(([id,t,d,to])=>`<a href="#${to}" class="doc-card"><span class="doc-icon">▤</span><span><strong>${esc(id)} · ${esc(t)}</strong><span>RELEASED · initial</span><p>${esc(d)}</p></span></a>`).join('')}</div><h2 class="section-heading">Source files not yet released</h2><div class="document-grid">${[['D-08','Event-level operational dataset','Upcoming'],['D-09','Information workflow / SOP','Upcoming'],['D-10','Staffing & resource allocation','Upcoming'],['D-11','Financial review and complication 1','Upcoming'],['D-12','Earlier pilot evaluation and AI work packet','Upcoming'],['D-13','Peer comparator and complication 2','Upcoming']].map(([id,t,w])=>`<div class="doc-card" style="cursor:default;opacity:.68"><span class="doc-icon">▧</span><span><strong>${id} · ${esc(t)}</strong><span>NOT YET RELEASED · ${w}</span></span></div>`).join('')}</div><div class="notice">Unavailable files are not present in this website package. New releases must be uploaded to the student site when their week begins.</div>`)}
function constraints(){return wrap(`${head('Constraints & Resources','Any proposed improvement must work within operational, public-information and service accessibility boundaries.','PART VIII · DECISION BOUNDARIES')}<div class="constraint-banner"><div><small>PROVISIONAL ADDITIONAL PILOT FUNDS</small><strong>$120,000</strong><small>Maximum; not a spending target</small></div><div><small>INITIAL IMPROVEMENT REVIEW</small><strong>12 weeks</strong><small>Cannot disrupt live train operations</small></div></div>${panel('Initial management conditions',C.constraints.map(([a,b])=>`<div class="constraint-row"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join(''))}<div class="notice"><strong>Human oversight:</strong> The project concerns administrative information and management decisions. Do not propose that an unapproved AI system control trains, generate unverified real-world service alerts, or replace safety-critical rail authority.</div>`)}
function modalClose(){overlay.innerHTML='';document.body.style.overflow=''}
function modalPerson(id){const p=C.people.find(x=>x.id===id);if(!p)return;overlay.innerHTML=`<div class="overlay" data-close><section class="modal" role="dialog" aria-modal="true" aria-label="Profile: ${esc(p.name)}"><button class="modal-close" data-close aria-label="Close profile">×</button><div class="modal-top"><img src="${p.img}" alt="Portrait of ${esc(p.name)}"><div><span class="eyebrow">STAKEHOLDER PROFILE</span><h2>${esc(p.name)}</h2><p>${esc(p.role)}</p><p style="margin-top:7px;font-size:11px">${esc(p.time)}</p></div></div><div class="modal-body"><div class="overline">PRIMARY RESPONSIBILITIES</div><p>${esc(p.focus)}</p><div class="quote">“${esc(p.line)}”</div><h3>What this manager sees</h3><p>${esc(p.detail)}</p><h3>A limitation worth considering</h3><p>${esc(p.blind)}</p><div class="case-note"><b>Question for the review team:</b> ${esc(p.question)}</div></div></section></div>`;document.body.style.overflow='hidden';overlay.querySelector('.modal-close').focus()}
function searchOpen(){const targets=[...routes.map(([to,title])=>({to,title,type:'Case section'})),...C.people.map(p=>({to:'people',title:p.name,type:p.role})),...C.incidents.map(i=>({to:'investigations',title:i.title,type:i.id+' · '+i.place}))];overlay.innerHTML=`<div class="overlay" data-close><section class="modal search-modal" role="dialog" aria-modal="true" aria-label="Search case materials"><button class="modal-close" data-close aria-label="Close search">×</button><h2 style="color:#153a63;margin:0 0 15px">Search case materials</h2><input class="field" style="width:100%" id="caseSearchInput" placeholder="Search sections, employees or incident descriptions…" aria-label="Search case file"><div id="caseSearchResults" style="max-height:350px;overflow:auto;margin-top:11px"></div></section></div>`;overlay.dataset.targets=JSON.stringify(targets);document.body.style.overflow='hidden';overlay.querySelector('input').focus();updateSearch('')}
function updateSearch(q){const targets=JSON.parse(overlay.dataset.targets||'[]'),r=targets.filter(t=>[t.title,t.type].join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('caseSearchResults').innerHTML=r.map(t=>`<a href="#${t.to}" class="search-result">${esc(t.title)}<small>${esc(t.type)}</small></a>`).join('')||'<div class="empty">No results found.</div>'}
const views={home:preview,story,people,investigations,channels,riders,metrics,documents,constraints};
function render(){const key=location.hash.slice(1)||'home';const page=views[key]?key:'home';navView(page);main.innerHTML=views[page]();sidebar.classList.remove('open');document.getElementById('mobileToggle').setAttribute('aria-expanded','false');document.getElementById('mobileDim')?.remove();document.title=`${routes.find(x=>x[0]===page)?.[1]} | NJ TRANSIT Case 04`;window.scrollTo(0,0)}
function renderSame(){const y=window.scrollY;let key=location.hash.slice(1)||'home';main.innerHTML=(views[key]||preview)();window.scrollTo(0,y)}
window.// Keep the current case page active when Skip to content is selected.
document.addEventListener('click', event => {
 const skipLink = event.target.closest('a[href="#main"]');
 if (!skipLink) return;
 event.preventDefault();
 const target = document.getElementById('main');
 if (target) {
   target.focus({preventScroll:true});
   target.scrollIntoView({block:'start'});
 }
});
addEventListener('hashchange',()=>{modalClose();render()});
document.addEventListener('click',e=>{let c=e.target.closest('[data-close]');if(c){if(c.classList.contains('overlay')&&e.target!==c)return;modalClose();return}const person=e.target.closest('[data-person]');if(person){modalPerson(person.dataset.person);return}const chap=e.target.closest('[data-chapter]');if(chap){const v=+chap.dataset.chapter;if(v>=0&&v<C.chapter.length){chapter=v;renderSame()}return}const inc=e.target.closest('[data-incident]');if(inc){incident=inc.dataset.incident;renderSame();return}if(e.target.closest('#searchButton')){searchOpen();return}if(e.target.closest('#mobileToggle')){const on=sidebar.classList.toggle('open');document.getElementById('mobileToggle').setAttribute('aria-expanded',String(on));if(on){let dim=document.createElement('div');dim.className='mobile-dim';dim.id='mobileDim';dim.onclick=()=>{sidebar.classList.remove('open');dim.remove()};document.body.appendChild(dim)}else document.getElementById('mobileDim')?.remove()}});
document.addEventListener('change',e=>{if(e.target.id==='metricSelect'){metric=e.target.value;renderSame()}if(e.target.id==='eventFilter'){eventFilter=e.target.value;const sub=C.incidents.filter(x=>eventFilter==='All'||x.corridor===eventFilter);if(!sub.some(x=>x.id===incident))incident=sub[0]?.id||incident;renderSame()}if(e.target.id==='riderType'){riderFilter=e.target.value;renderSame()}});
document.addEventListener('input',e=>{if(e.target.id==='caseSearchInput')updateSearch(e.target.value);if(e.target.id==='riderSearch'){riderQuery=e.target.value;const rows=C.feedback.filter(f=>(riderFilter==='All'||f.type===riderFilter)&&[f.id,f.date,f.type,f.corridor,f.quote].join(' ').toLowerCase().includes(riderQuery.toLowerCase()));document.getElementById('feedbackGrid').innerHTML=feedbackCards(rows);document.getElementById('feedbackCounter').textContent=`${rows.length} of ${C.feedback.length} records`}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modalClose();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchOpen()}});
render();
})();
